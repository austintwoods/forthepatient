<!--
  ForThePatient.org v5.4 (Session TRANSLATE-1 — June 2026)
  Plain-language patient summary on the detail card (closes S-4). CSS-only here;
  all logic is in app.js v1.1. Pure frontend; consumes the live B-ENF-FLAG
  contract read-only — no backend/scoring/schema changes.
  Changelog vs v5.3:
    T1-CSS: .patient-summary block — a calm "What this means for you" reading
          placed first in the detail-card body, on BOTH the desktop side panel and
          the mobile sheet (shared buildFacilityDetailHtml). A left accent bar
          shifts with the overall tone (good/mid/low/flag). Colors are the
          documented classification palette + accent + the existing #C0392B tint;
          the one good-tone bar (#5FA85F) is a darker shade of --cls-excep used
          only as a 4px accent (same treatment Invariant #18 grants the banner-icon
          tints) — no new brand/surface color. Also: .section-note (a one-line
          plain-language helper under "Component breakdown") and a clearer
          "1 (weakest) to 10 (strongest)" score-scale label. Desktop (>768px)
          layout otherwise unchanged (#29); sheet/modes/snaps/toggle/theme
          preserved (#30). The app.js v1.1 logic (buildPatientSummary) renders the
          copy; see its header for the percentile-phrasing and NULL-fallback
          decisions (Q-40).
-->
<!--
  ForThePatient.org v5.3 (Session ENF-VIZ-2 — June 2026)
  Enforcement filter + state drill-down dots + collapsed survey findings.
  Pure frontend; no backend/scoring/schema changes. Consumes the live B-ENF-FLAG
  contract read-only.
  Changelog vs v5.2:
    EV2-1: "RECENT CMS ENFORCEMENT" FILTER. A toggle in the desktop filter bar
          (a warning-tinted chip, distinct from the facility-type chips) and a
          matching full-width switch at the top of the mobile home sheet. When on,
          only facilities with has_active_enforcement are shown on the map, in the
          mobile list, and in the in-view stats. It is a CLIENT-SIDE view filter
          over the rows already fetched (visibleFacilities()) — it re-renders in
          place and does NOT issue a new RPC. Dedicated empty states ("No flagged
          facilities in view") on both surfaces. State var enforcementOnly (was
          declared-but-unused) now drives it; reset by Clear Filters.
    EV2-2: STATE DRILL-DOWN = INDIVIDUAL DOTS. When a state is selected from the
          national zoomed-out view (filteredState set), every facility is rendered
          as its own larger, brighter, white-bordered dot (.ftp-statedot, saturate
          boost) in an un-clustered layer (stateFacilityLayer) INSTEAD of the
          color-coded cluster pies. Dot color still reflects the rating; the
          enforcement ring still applies and, in this mode, shows for every
          severity (the whole state is laid out at once). Clustering is unchanged
          for the ordinary (non-state-filtered) facility view. Still L.divIcon,
          never circleMarker (#7); JS-resolved documented colors (#8, #18).
    EV2-3: SURVEY FINDINGS COLLAPSED BY DEFAULT. The detail card's "Survey findings
          (N)" no longer renders the first 4 rows up front. It now shows ONLY a
          single disclosure button ("Show N survey findings"); the full,
          newest-first list is revealed (and hidden) on click. Per-instance panel
          id + aria-expanded so it works in both the desktop panel and the mobile
          sheet. Replaces the old show-first-4 + "Show all" behavior.
    EV2-4: No backend/scoring/schema/methodology-code changes. No new dependencies,
          no new colors (enforcement warning tint #C0392B is the existing ENF-VIZ
          banner-icon tint, reused). Desktop (>768px) layout otherwise unchanged
          (Hard Invariant #29); sheet/modes/snaps/toggle/theme preserved (#30).
-->
<!--
  ForThePatient.org — frontend changelog (older sessions, trimmed to a pointer)
  The full per-session history lives in SESSION_HANDOFF.md (Session Execution
  History) and in git. Trimmed here at ENF-VIZ-2 to keep the single file under
  the 1,000-line code budget (Hard Invariant #16 / Decision 131). Summary of
  what remains in force and must not regress:
    v5.2 ENF-VIZ: severity-weighted map marker RINGS (4-tier enforcement_severity;
          dot fill keeps the score color; CRITICAL pulses; MODERATE/MINOR rings
          gated to zoom>=11 in the normal view); detail-card enforcement banner
          (active vs ungated expired-label vs none) + hospital_enforcement[] survey
          history; severity-aware mobile FLAGGED pill; desktop popup enforcement
          line. L.divIcon only, documented palette, escapeHtml all facility text.
    v5.1 K5-MOBILE-FT: "Near me" state machine w/ single in-flight guard + 4s
          timeout keeping a background watchPosition AND an explicit "Try again"
          (Q-42); nearby list + search dropdown hardened for 320-414px.
    v5.0 K5-MOBILE: mobile control model inverted into a persistent bottom "home
          sheet" (peek/half/full; home|detail modes; List/Map toggle); desktop
          (>768px) keeps the floating filter bar + side info-panel UNCHANGED;
          theme toggle retained; first-use guidance + score legend.
    v4.x K1-K3: state-bubble default view + geolocation centering; Hospitals-only
          default; client-side state scoping + dismissible state badge; early
          <head> theme init; JS-resolved cluster SVG colors; state-filter-aware
          empty state; Method nav hidden <=380px; 16px mobile inputs; >=40px touch
          targets; DEBUG-gated console; resize/orientation re-snap; inline About
          removed; header anchors.
-->
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="theme-color" content="#FDF8F0">
    <script>
    // Early theme init: apply persisted theme before body renders to prevent flash.
    (function(){try{var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('meta[name="theme-color"]').content='#1A1F36'}}catch(e){}})();
    </script>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#FDF8F0;--card-bg:#FFFFFF;--accent:#5B85C7;--text-primary:#2C3E50;--text-secondary:#7F8C8D;--border:#E1E8ED;--hover-bg:rgba(91,133,199,0.1);--button-hover:rgba(91,133,199,0.15);--focus-ring:rgba(91,133,199,0.45);--skeleton-base:#E1E8ED;--skeleton-shine:#F5F5F5;--cls-poor:#E8A0A0;--cls-below:#F0B8A0;--cls-average:#F8D08A;--cls-above:#B8E6A0;--cls-excep:#A0D8A0;--cls-unrated:#BDC3C7;--header-h:56px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--detail-w:380px}
        [data-theme="dark"]{--bg:#1A1F36;--card-bg:#2C3E50;--accent:#7FB3D3;--text-primary:#ECF0F1;--text-secondary:#BDC3C7;--border:#34495E;--hover-bg:rgba(127,179,211,0.1);--button-hover:rgba(127,179,211,0.15);--focus-ring:rgba(127,179,211,0.45);--skeleton-base:#34495E;--skeleton-shine:#3D5166}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400;background:var(--bg);color:var(--text-primary);overflow:hidden;height:100vh;height:100dvh;width:100vw;line-height:1.5;transition:background-color .3s,color .3s;overscroll-behavior:none}
        :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
        :focus:not(:focus-visible){outline:none}

        .header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:calc(var(--header-h) + var(--safe-top));padding-top:var(--safe-top);transition:all .3s}
        [data-theme="dark"] .header{background:rgba(44,62,80,.95)}
        .header-inner{max-width:1400px;margin:0 auto;padding:0 16px;padding-left:calc(16px + var(--safe-left));padding-right:calc(16px + var(--safe-right));display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:8px}
        .logo-link{display:flex;align-items:baseline;text-decoration:none;color:inherit;min-width:0}
        .logo{font-size:1.15rem;font-weight:600;color:var(--text-primary);letter-spacing:-.02em;white-space:nowrap}
        .logo-sub{font-size:.68rem;color:var(--text-secondary);font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin-left:8px;white-space:nowrap}
        .header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-btn{color:var(--text-secondary);text-decoration:none;font-size:.8rem;font-weight:500;padding:6px 10px;border-radius:6px;border:none;background:none;cursor:pointer;font-family:inherit;transition:color .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;min-height:32px}
        .nav-btn:hover,.nav-btn.active{color:var(--accent);background:var(--hover-bg)}
        .toggle-switch{position:relative;width:44px;height:26px;background:var(--border);border-radius:13px;cursor:pointer;transition:background .3s;border:none;min-width:44px;flex-shrink:0}
        .toggle-switch.active{background:var(--accent)}
        .toggle-slider{position:absolute;top:2px;left:2px;width:22px;height:22px;background:var(--card-bg);border-radius:50%;transition:transform .3s;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text-secondary)}
        .toggle-switch.active .toggle-slider{transform:translateX(18px)}

        .main{margin-top:calc(var(--header-h) + var(--safe-top));height:calc(100vh - var(--header-h) - var(--safe-top));height:calc(100dvh - var(--header-h) - var(--safe-top));position:relative;overflow:hidden}
        #map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);touch-action:none}

        .filter-bar{position:absolute;top:12px;left:12px;right:12px;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;padding:8px 12px;box-shadow:0 2px 16px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;transition:all .3s}
        [data-theme="dark"] .filter-bar{background:rgba(44,62,80,.92)}
        .search-compact{position:relative;flex-shrink:0}
        .search-compact input{width:180px;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card-bg);color:var(--text-primary);font-family:inherit;transition:border-color .2s,width .3s;min-height:36px}
        .search-compact input:focus{border-color:var(--accent);width:240px}
        .search-compact .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--text-secondary);pointer-events:none}
        .search-compact .name-results{position:absolute;top:100%;left:0;width:320px;max-width:calc(100vw - 24px - var(--safe-left) - var(--safe-right));background:var(--card-bg);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:280px;overflow-y:auto;display:none;z-index:600}
        .search-compact .name-results.active{display:block}
        .filter-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
        .chip-scroll-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
        .chip-scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0;padding-right:2px}
        .chip-scroll::-webkit-scrollbar{display:none}
        .f-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:16px;font-size:.72rem;font-weight:500;cursor:pointer;background:var(--card-bg);color:var(--text-secondary);transition:all .15s;user-select:none;white-space:nowrap;min-height:32px;flex-shrink:0;font-family:inherit}
        .f-chip:hover{background:var(--hover-bg);color:var(--text-primary)}
        .f-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .f-chip.spec{border-style:dashed}
        .f-chip.spec.active{border-style:solid}
        .f-chip.disabled{opacity:.35;cursor:default}
        .f-chip i{font-size:.68rem}
        .stats-inline{display:flex;gap:10px;align-items:center;flex-shrink:0;margin-left:auto;font-size:.72rem;color:var(--text-secondary);white-space:nowrap}
        .stats-inline strong{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
        .stats-inline .stat-item{display:inline-flex;align-items:center;gap:3px}
        .stats-inline .stat-item + .stat-item::before{content:"·";opacity:.5;margin-right:4px;font-weight:400}

        .state-filter-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:.72rem;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit;line-height:1;transition:opacity .15s,background .15s;min-height:30px}
        .state-filter-badge:hover{opacity:.9}
        .state-filter-badge .state-filter-x{font-size:.7rem;opacity:.85;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.18)}
        .state-filter-badge[hidden]{display:none!important}

        .info-panel{position:absolute;top:68px;right:12px;width:var(--detail-w);max-height:calc(100dvh - var(--header-h) - var(--safe-top) - 100px);overflow-y:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);z-index:450;display:none;transition:all .3s}
        .info-panel.active{display:block}
        .info-panel.pinned{top:0;right:0;height:100%;max-height:100%;border-radius:0;border-right:none;border-top:none;border-bottom:none}
        .resize-handle{position:absolute;top:0;left:-4px;width:8px;height:100%;cursor:col-resize;z-index:10}
        .resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:32px;border-radius:2px;background:var(--border);opacity:0;transition:opacity .2s}
        .resize-handle:hover::after,.resize-handle:active::after{opacity:1}

        .facility-info{padding:22px;position:relative;padding-top:14px;padding-left:max(22px,calc(22px + var(--safe-left)));padding-right:max(22px,calc(22px + var(--safe-right)))}
        .detail-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-bottom:8px}
        .detail-action-btn{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .2s;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;font-family:inherit}
        .detail-action-btn:hover{background:var(--hover-bg);color:var(--text-primary)}
        .facility-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
        .facility-name{font-size:1.1rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
        .facility-type-line{font-size:.72rem;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}

        .section-header{font-size:.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
        .component-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}

        .specialty-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

        .addr-block{margin-top:16px;font-size:.8rem;color:var(--text-secondary);line-height:1.55;overflow-wrap:anywhere}

        .name-result-item{padding:12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem;min-height:48px;display:flex;flex-direction:column;justify-content:center}
        .name-result-item:last-child{border-bottom:none}
        .name-result-item:hover,.name-result-item.kb-active{background:var(--hover-bg)}
        .name-result-name{font-weight:600;color:var(--text-primary)}
        .name-result-meta{font-size:.72rem;color:var(--text-secondary);margin-top:2px}
        .name-result-score{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.68rem;font-weight:600;color:#2C3E50}

        .state-bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:'Inter',-apple-system,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);border:2px solid rgba(255,255,255,.8)}
        .state-bubble:hover{transform:scale(1.12);box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:1000!important}
        .state-bubble .st-abbr{font-weight:700;line-height:1}
        .state-bubble .st-count{font-weight:500;opacity:.85;line-height:1}

        .ftp-dot{border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;transition:transform .1s}

        .marker-cluster{background:none!important}
        .marker-cluster div{width:36px;height:36px;margin-left:2px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#2C3E50;background:var(--cls-average);box-shadow:0 1px 6px rgba(0,0,0,.15)}

        .marker-cluster-medium div{background:var(--cls-average)}
        .marker-cluster-large div{background:var(--cls-below)}
        .cluster-pie{position:absolute;top:0;left:0}

        @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
        .skeleton-block{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-shine) 50%,var(--skeleton-base) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px}
        .skeleton-circle{width:64px;height:64px;border-radius:50%}
        .skeleton-line{height:12px;margin-bottom:8px}
        .skeleton-line.w70{width:70%}.skeleton-line.w50{width:50%}.skeleton-line.w90{width:90%}.skeleton-line.w40{width:40%}
        .skeleton-bar{height:4px;width:100%;margin-top:6px}

        .empty-state,.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--text-secondary)}
        .empty-state i,.error-state i{font-size:2rem;margin-bottom:12px;color:var(--border)}
        .empty-state h4,.error-state h4{font-size:1rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
        .empty-state p,.error-state p{font-size:.875rem;margin-bottom:12px}
        .clear-btn,.retry-btn{padding:12px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.875rem;font-weight:500;cursor:pointer;font-family:inherit;min-height:48px;transition:opacity .2s}
        .clear-btn:hover,.retry-btn:hover{opacity:.85}
        .error-link{display:block;margin-top:8px;font-size:.75rem;color:var(--accent)}

        .query-loading{position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);z-index:600;opacity:0;transition:opacity .2s}

        .enf-disc-btn .ed-label{flex:1;min-width:0}
        .enf-disc-btn .ed-caret{flex-shrink:0;color:var(--text-secondary);font-size:.7rem}
        .enf-disc-panel[hidden]{display:none}
        .enf-disc-panel{margin-top:4px}
        /* ── TRANSLATE-1: plain-language patient summary ───────────────────────
           A calm reading of the data, placed first in the card body (persona-1
           wins). The left accent bar shifts with the overall tone; every color is
           from the documented classification palette / accent — no new colors
           (Invariant #18). Distinct from the alarm-toned .enf-banner. */
        .patient-summary{margin:16px 0 4px;padding:14px 16px 12px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;background:var(--hover-bg)}
        .patient-summary .ps-eyebrow{display:flex;align-items:center;gap:7px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:8px}
        .patient-summary .ps-eyebrow i{font-size:.78rem;color:var(--accent)}
        .patient-summary .ps-line{font-size:.92rem;line-height:1.5;color:var(--text-primary);margin:0 0 8px}
        .patient-summary .ps-line:last-of-type{margin-bottom:6px}
        .patient-summary .ps-foot{font-size:.7rem;color:var(--text-secondary);line-height:1.45;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
        .patient-summary .ps-foot a{color:var(--accent);text-decoration:none}
        .patient-summary .ps-foot a:hover{text-decoration:underline}
        /* tone bar + eyebrow icon by overall reading */
        .patient-summary.tone-good{border-left-color:#5FA85F}
        .patient-summary.tone-good .ps-eyebrow i{color:#5FA85F}
        .patient-summary.tone-mid{border-left-color:var(--accent)}
        .patient-summary.tone-low{border-left-color:#C0392B}
        .patient-summary.tone-low .ps-eyebrow i{color:#C0392B}
        .patient-summary.tone-flag{border-left-color:#C0392B;background:rgba(232,160,160,.12)}
        .patient-summary.tone-flag .ps-eyebrow i{color:#C0392B}
        [data-theme="dark"] .patient-summary.tone-good{border-left-color:#A0D8A0}
        [data-theme="dark"] .patient-summary.tone-good .ps-eyebrow i{color:#A0D8A0}
        .section-note{font-size:.74rem;color:var(--text-secondary);line-height:1.45;margin:-4px 0 10px}
        .print-methodology-url{display:none}
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
    <div class="offline-toast" id="offline-toast" role="alert" aria-live="assertive"><i class="fas fa-wifi" style="margin-right:6px;opacity:.7"></i> You're offline.</div>

    <header class="header" role="banner">
        <div class="header-inner">
            <a href="/" class="logo-link" aria-label="ForThePatient home"><div class="logo">For The Patient</div><span class="logo-sub">Healthcare Quality</span></a>
            <div class="header-right">
                <a class="nav-btn active" href="/" aria-label="Map" aria-current="page">Map</a>
                <a class="nav-btn" href="/about" aria-label="About">About</a>
                <a class="nav-btn" href="/methodology" aria-label="Methodology">Method</a>
                <button class="toggle-switch" id="theme-toggle-btn" onclick="toggleTheme()" role="switch" aria-checked="false" aria-label="Toggle dark mode" type="button"><div class="toggle-slider"><i class="fas fa-sun" aria-hidden="true"></i></div></button>
            </div>
        </div>
    </header>

    <main class="main" id="map-page" role="main">
        <div id="map" role="application" aria-label="Healthcare facility map"></div>
        <div class="query-loading" id="query-loading" role="progressbar" aria-label="Loading"></div>
        <div class="filter-bar" id="filter-bar" role="search" aria-label="Filters">
            <div class="search-compact"><i class="fas fa-search search-icon" aria-hidden="true"></i><input type="text" id="name-search" placeholder="Search facility…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="name-results" aria-autocomplete="list" aria-label="Search facility by name"><div class="name-results" id="name-results" role="listbox"></div></div>
            <div class="filter-divider" aria-hidden="true"></div>
            <button class="state-filter-badge" id="state-filter-badge" type="button" hidden aria-label="Clear state filter"><span id="state-filter-name"></span><i class="fas fa-times state-filter-x" aria-hidden="true"></i></button>
            <button class="enf-filter-chip" id="enf-filter-chip" type="button" aria-pressed="false" aria-label="Show only facilities under recent CMS enforcement" title="Show only facilities under recent CMS enforcement"><i class="fas fa-gavel" aria-hidden="true"></i> Recent CMS enforcement</button>
            <div class="chip-scroll-wrap"><div class="chip-scroll" id="chip-scroll" role="group" aria-label="Filters"></div></div>
            <div class="stats-inline" aria-live="polite"><span class="stat-item"><strong id="total-count">0</strong><span class="stats-label">&nbsp;in view</span></span><span class="stat-item"><span class="stats-label">avg&nbsp;</span><strong id="avg-score">—</strong></span></div>
        </div>
        <aside class="info-panel" id="info-panel" role="dialog" aria-modal="false" aria-label="Facility details"><div class="resize-handle" id="resize-handle" aria-hidden="true"></div><div id="facility-info-content"><div class="empty-state"><i class="fas fa-map-marker-alt" aria-hidden="true"></i><h4>Select a Facility</h4><p>Click any point on the map to view detailed quality scores</p></div></div></aside>
        <div class="footer-bar" aria-label="Legal"><a href="/about">About</a><a href="/methodology">Methodology</a><a href="/medical-disclaimer">Disclaimer</a><a href="/dispute-process">Dispute</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
    </main>

    <div class="bottom-sheet" id="detail-sheet" aria-label="Facilities" role="region" aria-hidden="false">
        <div class="sheet-handle" id="detail-sheet-handle" aria-hidden="true"></div>
        <!-- HOME mode: mobile control center -->
        <div class="sheet-home" id="sheet-home">
            <div class="sheet-rail">
                <div class="view-toggle" id="view-toggle" role="group" aria-label="List or map view">
                    <button type="button" data-view="list" class="on" aria-pressed="true"><i class="fas fa-list-ul" aria-hidden="true"></i> List</button>
                    <button type="button" data-view="map" aria-pressed="false"><i class="fas fa-map" aria-hidden="true"></i> Map</button>
                </div>
                <div class="sheet-find-label">Find a facility</div>
                <div class="sheet-search-row">
                    <div class="sheet-search"><i class="fas fa-search s-ic" aria-hidden="true"></i><input type="text" id="sheet-search" placeholder="Search by hospital or facility name" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="sheet-search-results" aria-autocomplete="list" aria-label="Search facility by name"></div>
                    <button class="sheet-nearme" id="sheet-nearme" type="button" aria-label="Find facilities near me"><i class="fas fa-location-crosshairs" aria-hidden="true"></i> Near me</button>
                </div>
            </div>
            <div class="sheet-scroll" id="sheet-scroll">
                <div class="sheet-search-results" id="sheet-search-results" role="listbox"></div>
                <button class="sheet-enf-toggle" id="sheet-enf-toggle" type="button" aria-pressed="false" aria-label="Show only facilities under recent CMS enforcement"><span class="sx-ic" aria-hidden="true"><i class="fas fa-gavel"></i></span><span class="sx-label">Recent CMS enforcement<span class="sx-sub">Show only flagged facilities</span></span><span class="sx-knob" aria-hidden="true"></span></button>
                <div class="sheet-chips" id="sheet-chips" role="group" aria-label="Facility types"></div>
                <div class="sheet-statsrow">
                    <span class="sheet-stats" id="sheet-stats" aria-live="polite"></span>
                    <button class="sheet-state-pill" id="sheet-state-pill" type="button" aria-label="Clear state filter"><span id="sheet-state-name"></span><i class="fas fa-times x" aria-hidden="true"></i></button>
                </div>
                <div class="sheet-list" id="sheet-list"></div>
            </div>
        </div>
        <!-- DETAIL mode: facility detail (shared renderer) -->
        <div class="sheet-detail" id="sheet-detail" hidden>
            <div class="sheet-body" id="detail-sheet-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
