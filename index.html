<!--
  ForThePatient.org v4.1 (Session K1 — May 2026)
  Mobile audit & fix pass.
  Changelog vs v4.0:
    - Inline About page removed (now /about static page).
    - Header Map/About converted to <a> anchors; logo wrapped in home anchor.
    - Footer-bar visible on mobile portrait (hidden in landscape).
    - Filter chip-scroll: mobile fade-mask affordance + safe-area inset.
    - Search input bumped to 16px on mobile (kills iOS auto-zoom-on-focus).
    - Bottom sheet rewrite: dedicated close button, dynamic snap recompute on
      resize/rotate, listeners replaced via cloneNode, no more 64px peek-stuck.
    - Pin button hidden on mobile (info-panel doesn't exist on mobile).
    - Touch targets bumped to >=40px across nav, chips, action buttons.
    - facility-info gains horizontal safe-area padding.
    - Console output gated behind DEBUG flag (?debug=1 or localhost).
    - Resize / orientationchange handler rebinds sheet handle and re-snaps.
    - <=380px breakpoint added for narrow phones.
    - Misc: leaflet attribution shrunk, theme-color set on load.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>For The Patient — Healthcare Quality Map</title>
    <meta name="description" content="Independent quality scores for 48,000+ Medicare-certified facilities. Hospitals, nursing homes, dialysis, home health, hospice, IRF, LTCH. Built from compulsory CMS data. Zero industry funding.">
    <meta name="theme-color" content="#FDF8F0">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://nhajnwffxlztmoadqcdl.supabase.co">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#FDF8F0;--card-bg:#FFFFFF;--accent:#5B85C7;--text-primary:#2C3E50;--text-secondary:#7F8C8D;--border:#E1E8ED;--hover-bg:rgba(91,133,199,0.1);--button-hover:rgba(91,133,199,0.15);--focus-ring:rgba(91,133,199,0.45);--skeleton-base:#E1E8ED;--skeleton-shine:#F5F5F5;--cls-poor:#E8A0A0;--cls-below:#F0B8A0;--cls-average:#F8D08A;--cls-above:#B8E6A0;--cls-excep:#A0D8A0;--cls-unrated:#BDC3C7;--header-h:56px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--detail-w:380px}
        [data-theme="dark"]{--bg:#1A1F36;--card-bg:#2C3E50;--accent:#7FB3D3;--text-primary:#ECF0F1;--text-secondary:#BDC3C7;--border:#34495E;--hover-bg:rgba(127,179,211,0.1);--button-hover:rgba(127,179,211,0.15);--focus-ring:rgba(127,179,211,0.45);--skeleton-base:#34495E;--skeleton-shine:#3D5166}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400;background:var(--bg);color:var(--text-primary);overflow:hidden;height:100vh;height:100dvh;width:100vw;line-height:1.5;transition:background-color .3s,color .3s;overscroll-behavior:none}
        :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
        :focus:not(:focus-visible){outline:none}

        .header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:calc(var(--header-h) + var(--safe-top));padding-top:var(--safe-top);transition:all .3s}
        [data-theme="dark"] .header{background:rgba(44,62,80,.95)}
        .header-inner{max-width:1400px;margin:0 auto;padding:0 16px;padding-left:calc(16px + var(--safe-left));padding-right:calc(16px + var(--safe-right));display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:8px}
        .logo-link{display:flex;align-items:baseline;text-decoration:none;color:inherit;min-width:0}
        .logo{font-size:1.15rem;font-weight:600;color:var(--text-primary);letter-spacing:-.02em;white-space:nowrap}
        .logo-sub{font-size:.68rem;color:var(--text-secondary);font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin-left:8px;white-space:nowrap}
        .header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-btn{color:var(--text-secondary);text-decoration:none;font-size:.8rem;font-weight:500;padding:6px 10px;border-radius:6px;border:none;background:none;cursor:pointer;font-family:inherit;transition:color .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;min-height:32px}
        .nav-btn:hover,.nav-btn.active{color:var(--accent);background:var(--hover-bg)}
        .toggle-switch{position:relative;width:44px;height:26px;background:var(--border);border-radius:13px;cursor:pointer;transition:background .3s;border:none;min-width:44px;flex-shrink:0}
        .toggle-switch.active{background:var(--accent)}
        .toggle-slider{position:absolute;top:2px;left:2px;width:22px;height:22px;background:var(--card-bg);border-radius:50%;transition:transform .3s;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text-secondary)}
        .toggle-switch.active .toggle-slider{transform:translateX(18px)}

        .main{margin-top:calc(var(--header-h) + var(--safe-top));height:calc(100vh - var(--header-h) - var(--safe-top));height:calc(100dvh - var(--header-h) - var(--safe-top));position:relative;overflow:hidden}
        #map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);touch-action:none}

        .filter-bar{position:absolute;top:12px;left:12px;right:12px;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;padding:8px 12px;box-shadow:0 2px 16px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;transition:all .3s}
        [data-theme="dark"] .filter-bar{background:rgba(44,62,80,.92)}
        .search-compact{position:relative;flex-shrink:0}
        .search-compact input{width:180px;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card-bg);color:var(--text-primary);font-family:inherit;transition:border-color .2s,width .3s;min-height:36px}
        .search-compact input:focus{border-color:var(--accent);width:240px}
        .search-compact .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--text-secondary);pointer-events:none}
        .search-compact .name-results{position:absolute;top:100%;left:0;width:320px;max-width:calc(100vw - 24px - var(--safe-left) - var(--safe-right));background:var(--card-bg);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:280px;overflow-y:auto;display:none;z-index:600}
        .search-compact .name-results.active{display:block}
        .filter-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
        .chip-scroll-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
        .chip-scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0;padding-right:2px}
        .chip-scroll::-webkit-scrollbar{display:none}
        .f-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:16px;font-size:.72rem;font-weight:500;cursor:pointer;background:var(--card-bg);color:var(--text-secondary);transition:all .15s;user-select:none;white-space:nowrap;min-height:32px;flex-shrink:0;font-family:inherit}
        .f-chip:hover{background:var(--hover-bg);color:var(--text-primary)}
        .f-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .f-chip.spec{border-style:dashed}
        .f-chip.spec.active{border-style:solid}
        .f-chip.disabled{opacity:.35;cursor:default}
        .f-chip i{font-size:.68rem}
        .stats-inline{display:flex;gap:12px;align-items:center;flex-shrink:0;margin-left:auto;font-size:.72rem;color:var(--text-secondary);white-space:nowrap}
        .stats-inline strong{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}

        .info-panel{position:absolute;top:68px;right:12px;width:var(--detail-w);max-height:calc(100dvh - var(--header-h) - var(--safe-top) - 100px);overflow-y:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);z-index:450;display:none;transition:all .3s}
        .info-panel.active{display:block}
        .info-panel.pinned{top:0;right:0;height:100%;max-height:100%;border-radius:0;border-right:none;border-top:none;border-bottom:none}
        .resize-handle{position:absolute;top:0;left:-4px;width:8px;height:100%;cursor:col-resize;z-index:10}
        .resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:32px;border-radius:2px;background:var(--border);opacity:0;transition:opacity .2s}
        .resize-handle:hover::after,.resize-handle:active::after{opacity:1}

        .facility-info{padding:22px;position:relative;padding-top:14px;padding-left:max(22px,calc(22px + var(--safe-left)));padding-right:max(22px,calc(22px + var(--safe-right)))}
        .detail-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-bottom:8px}
        .detail-action-btn{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .2s;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;font-family:inherit}
        .detail-action-btn:hover{background:var(--hover-bg);color:var(--text-primary)}
        .facility-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
        .facility-name{font-size:1.1rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
        .facility-type-line{font-size:.72rem;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
        .score-block{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap}
        .score-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:700;color:#2C3E50;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .score-circle.unrated{color:var(--text-secondary)}
        .score-meta{flex:1;min-width:0}
        .classification-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.72rem;font-weight:600;color:#2C3E50}
        .classification-badge.unrated{color:var(--text-secondary);background:var(--cls-unrated)}
        .score-out-of{display:block;font-size:.72rem;color:var(--text-secondary);margin-top:4px}
        .cms-stars{display:block;font-size:.72rem;color:var(--text-secondary);margin-top:2px}
        .cms-stars .star-icon{color:#f5b80b}
        .section-header{font-size:.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
        .component-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
        .component-row:last-child{border-bottom:none}
        .component-name{color:var(--text-primary);min-width:0;overflow-wrap:anywhere}
        .component-weight{color:var(--text-secondary);font-size:.72rem}
        .component-score{font-weight:600;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
        .component-bar{grid-column:1/-1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
        .component-bar-fill{height:100%;border-radius:2px;transition:width .3s}
        .component-na{color:var(--text-secondary);font-style:italic;font-size:.75rem}
        .specialty-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
        .spec-badge{font-size:.68rem;padding:3px 8px;background:var(--hover-bg);color:var(--accent);border-radius:10px;font-weight:500}
        .enforcement-block{margin-top:14px;padding:12px;background:rgba(232,160,160,.12);border:1px solid rgba(232,160,160,.4);border-radius:8px;font-size:.78rem}
        .enforcement-title{font-weight:600;color:var(--text-primary);margin-bottom:4px}
        .enforcement-amt{font-size:.7rem;color:var(--text-secondary)}
        .addr-block{margin-top:16px;font-size:.8rem;color:var(--text-secondary);line-height:1.55;overflow-wrap:anywhere}
        .addr-block i{width:16px;color:var(--accent);margin-right:4px}
        .directions-btn{display:block;text-align:center;margin-top:16px;padding:12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-size:.875rem;font-weight:500;min-height:48px;line-height:24px}

        .name-result-item{padding:12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem;min-height:48px;display:flex;flex-direction:column;justify-content:center}
        .name-result-item:last-child{border-bottom:none}
        .name-result-item:hover,.name-result-item.kb-active{background:var(--hover-bg)}
        .name-result-name{font-weight:600;color:var(--text-primary)}
        .name-result-meta{font-size:.72rem;color:var(--text-secondary);margin-top:2px}
        .name-result-score{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.68rem;font-weight:600;color:#2C3E50}

        .state-bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:'Inter',-apple-system,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);border:2px solid rgba(255,255,255,.8)}
        .state-bubble:hover{transform:scale(1.12);box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:1000!important}
        .state-bubble .st-abbr{font-weight:700;line-height:1}
        .state-bubble .st-count{font-weight:500;opacity:.85;line-height:1}
        [data-theme="dark"] .state-bubble{border-color:rgba(255,255,255,.3)}
        .ftp-dot{border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;transition:transform .1s}
        .ftp-dot:hover{transform:scale(1.3);z-index:1000!important}
        .marker-cluster{background:none!important}
        .marker-cluster div{width:36px;height:36px;margin-left:2px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#2C3E50;background:var(--cls-average);box-shadow:0 1px 6px rgba(0,0,0,.15)}
        .marker-cluster-small div{background:var(--cls-above)}
        .marker-cluster-medium div{background:var(--cls-average)}
        .marker-cluster-large div{background:var(--cls-below)}
        .cluster-pie{position:absolute;top:0;left:0}

        @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
        .skeleton-block{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-shine) 50%,var(--skeleton-base) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px}
        .skeleton-circle{width:64px;height:64px;border-radius:50%}
        .skeleton-line{height:12px;margin-bottom:8px}
        .skeleton-line.w70{width:70%}.skeleton-line.w50{width:50%}.skeleton-line.w90{width:90%}.skeleton-line.w40{width:40%}
        .skeleton-bar{height:4px;width:100%;margin-top:6px}

        .empty-state,.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--text-secondary)}
        .empty-state i,.error-state i{font-size:2rem;margin-bottom:12px;color:var(--border)}
        .empty-state h4,.error-state h4{font-size:1rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
        .empty-state p,.error-state p{font-size:.875rem;margin-bottom:12px}
        .clear-btn,.retry-btn{padding:12px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.875rem;font-weight:500;cursor:pointer;font-family:inherit;min-height:48px;transition:opacity .2s}
        .clear-btn:hover,.retry-btn:hover{opacity:.85}
        .error-link{display:block;margin-top:8px;font-size:.75rem;color:var(--accent)}

        .query-loading{position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);z-index:600;opacity:0;transition:opacity .2s}
        .query-loading.active{opacity:1;animation:indeterminate 1.4s infinite linear}
        @keyframes indeterminate{0%{transform:translateX(-100%) scaleX(.3)}50%{transform:translateX(0%) scaleX(.6)}100%{transform:translateX(100%) scaleX(.3)}}
        .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s}
        .loading-overlay.hidden{opacity:0;pointer-events:none}
        .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .offline-toast{position:fixed;top:calc(var(--header-h) + var(--safe-top) + 10px);left:50%;transform:translateX(-50%);background:#E74C3C;color:#fff;padding:10px 20px;border-radius:8px;font-size:.82rem;font-weight:500;z-index:2000;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}
        .offline-toast.active{display:block}

        .leaflet-popup-content-wrapper{background:var(--card-bg);color:var(--text-primary);border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
        .leaflet-popup-content{margin:14px;font-size:.82rem;line-height:1.4}
        .leaflet-popup-tip{background:var(--card-bg)}
        .leaflet-control-zoom{display:none!important}
        .leaflet-control-attribution{font-size:.62rem!important;padding:1px 5px!important}

        .footer-bar{position:absolute;bottom:calc(12px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:.68rem;display:flex;gap:12px;z-index:350;box-shadow:0 2px 12px rgba(0,0,0,.06);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;white-space:nowrap}
        .footer-bar::-webkit-scrollbar{display:none}
        [data-theme="dark"] .footer-bar{background:rgba(44,62,80,.92)}
        .footer-bar a{color:var(--text-secondary);text-decoration:none;transition:color .15s;flex-shrink:0}
        .footer-bar a:hover{color:var(--accent)}

        .bottom-sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--card-bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);height:0;max-height:90vh;max-height:90dvh;overflow:hidden;transition:height .3s cubic-bezier(.25,.1,.25,1);touch-action:none;flex-direction:column;box-sizing:border-box}
        .sheet-handle{display:flex;justify-content:center;padding:10px 0 6px;cursor:grab;flex-shrink:0;touch-action:none}
        .sheet-handle::after{content:'';width:40px;height:4px;background:var(--border);border-radius:2px}
        .sheet-close-btn{position:absolute;top:6px;right:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-secondary);font-size:1rem;cursor:pointer;z-index:10;border-radius:8px;font-family:inherit;padding:0}
        .sheet-close-btn:hover,.sheet-close-btn:focus-visible{background:var(--hover-bg);color:var(--text-primary)}
        .sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 0 calc(20px + var(--safe-bottom))}

        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-secondary)}
        [data-tooltip]{position:relative}
        [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--card-bg);padding:4px 8px;border-radius:4px;font-size:.68rem;white-space:nowrap;z-index:1000;pointer-events:none}

        @media(max-width:768px){
            .filter-bar{top:8px;left:calc(8px + var(--safe-left));right:calc(8px + var(--safe-right));padding:6px 8px;gap:6px}
            .search-compact input{width:140px;padding:8px 10px 8px 28px;font-size:16px;min-height:40px}
            .search-compact input:focus{width:180px}
            .search-compact .search-icon{font-size:.78rem}
            .info-panel{display:none!important}
            .bottom-sheet{display:flex}
            .stats-inline{display:none}
            .logo-sub{display:none}
            .nav-btn{padding:8px 10px;min-height:36px;font-size:.82rem}
            .f-chip{padding:7px 12px;min-height:36px;font-size:.78rem}
            .detail-action-btn{min-width:40px;min-height:40px;font-size:.95rem}
            .detail-action-btn[data-pin]{display:none!important}
            .chip-scroll-wrap{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 12px,#000 calc(100% - 18px),transparent 100%)}

:41.680893,lng:-71.51178},{n:'South Carolina',s:'SC',lat:33.856892,lng:-80.945007},{n:'South Dakota',s:'SD',lat:44.299782,lng:-99.438828},{n:'Tennessee',s:'TN',lat:35.747845,lng:-86.692345},{n:'Texas',s:'TX',lat:31.054487,lng:-97.563461},{n:'Utah',s:'UT',lat:40.150032,lng:-111.862434},{n:'Vermont',s:'VT',lat:44.045876,lng:-72.710686},{n:'Virginia',s:'VA',lat:37.769337,lng:-78.169968},{n:'Washington',s:'WA',lat:47.400902,lng:-121.490494},{n:'West Virginia',s:'WV',lat:38.491226,lng:-80.954456},{n:'Wisconsin',s:'WI',lat:44.268543,lng:-89.616508},{n:'Wyoming',s:'WY',lat:42.755966,lng:-107.30249},{n:'District of Columbia',s:'DC',lat:38.897438,lng:-77.026817},{n:'Puerto Rico',s:'PR',lat:18.220833,lng:-66.590149},{n:'Guam',s:'GU',lat:13.444304,lng:144.793731},{n:'U.S. Virgin Islands',s:'VI',lat:18.335765,lng:-64.896335}];
    const STATE_BY_ABBR=Object.fromEntries(US_STATES.map(s=>[s.s,s]));

    // Debug logging gate: only console.log in localhost or with ?debug=1
    const DEBUG=(function(){try{return(new URLSearchParams(location.search).get('debug')==='1')||location.hostname==='localhost'||location.hostname==='127.0.0.1'}catch(e){return false}})();

    let map,clusterLayer,stateBubbleLayer;
    let currentTheme='light',currentFacilities=[],openFacilityId=null;
    let activeTypes=new Set(FACILITY_TYPES.map(t=>t.value));
    let activeSpecialties={teaching:false,nicu:false,cath:false,trauma:false,er:false};
    let isMobile=false,isOnline=navigator.onLine,isTouching=false,pendingFetch=false,detailPanelPinned=false,inflightController=null;
    let stateSummaryCache=null,currentViewMode='state';
    let sheetState='closed';

    function classColor(c){return CLASS_COLORS[c]||CLASS_COLORS.Unrated}
    function classBadgeClass(c){return(!c||c==='Unrated')?'unrated':''}
    function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}}
    function truthy(v){if(v===true)return true;if(v===false||v==null)return false;const s=String(v).toLowerCase();return s==='y'||s==='yes'||s==='true'||s==='1'}
    function escapeHtml(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
    function scoreToBarColor(s){if(s==null)return'var(--border)';if(s>=7.5)return'#A0D8A0';if(s>=6)return'#B8E6A0';if(s>=4.5)return'#F8D08A';if(s>=3)return'#F0B8A0';return'#E8A0A0'}
    function scoreToClassColor(s){if(s==null)return'#BDC3C7';if(s>=7.5)return'#A0D8A0';if(s>=6)return'#B8E6A0';if(s>=4.5)return'#F8D08A';if(s>=3)return'#F0B8A0';return'#E8A0A0'}
    function haptic(ms){if(isMobile&&navigator.vibrate)try{navigator.vibrate(ms||10)}catch(e){}}

    function getViewportRadiusMiles(){if(!map)return 25;const b=map.getBounds(),d=map.distance(b.getNorthEast(),b.getSouthWest());const h=(d/1609.344)/2;return Math.max(2,Math.min(2000,Math.ceil(h)))}

    function getUrlState(){const p=new URLSearchParams(location.search);return{lat:parseFloat(p.get('lat'))||null,lng:parseFloat(p.get('lng'))||null,z:parseInt(p.get('z'))||null,types:p.get('types')?p.get('types').split(','):null,specialties:p.get('sp')?p.get('sp').split(','):[],facilityId:p.get('fid')||null,theme:p.get('theme')||null}}
    function pushUrlState(replace){if(!map)return;const c=map.getCenter(),p=new URLSearchParams;p.set('lat',c.lat.toFixed(4));p.set('lng',c.lng.toFixed(4));p.set('z',map.getZoom());const t=Array.from(activeTypes);if(t.length<FACILITY_TYPES.length)p.set('types',t.join(','));const sp=Object.entries(activeSpecialties).filter(([,v])=>v).map(([k])=>k);if(sp.length)p.set('sp',sp.join(','));if(openFacilityId)p.set('fid',openFacilityId);if(currentTheme==='dark')p.set('theme','dark');const url=location.pathname+'?'+p.toString();if(replace)history.replaceState(null,'',url);else history.pushState(null,'',url)}

    function initMap(){
        const u=getUrlState();
        const center=(u.lat&&u.lng)?[u.lat,u.lng]:[39.5,-98.0];
        const zoom=u.z||5;
        map=L.map('map',{center,zoom,zoomControl:false,preferCanvas:true});

        L.tileLayer(tileUrl,{attribution:'&copy; CARTO &middot; CMS public data',subdomains:'abcd',maxZoom:20}).addTo(map);
        clusterLayer=L.markerClusterGroup({maxClusterRadius:50,spiderfyOnMaxZoom:true,showCoverageOnHover:false,zoomToBoundsOnClick:true,chunkedLoading:true,iconCreateFunction:createClusterIcon,disableClusteringAtZoom:16});
        map.addLayer(clusterLayer);
        stateBubbleLayer=L.layerGroup().addTo(map);
        map.getContainer().addEventListener('touchstart',()=>{isTouching=true},{passive:true});
        map.getContainer().addEventListener('touchend',()=>{isTouching=false;if(pendingFetch){pendingFetch=false;onViewChange()}},{passive:true});
        const dv=debounce(()=>{if(isTouching){pendingFetch=true;return}onViewChange();pushUrlState(true)},300);
        map.on('moveend',dv);map.on('zoomend',dv);
        buildFilterChips();wireNameSearch();wireResizeHandle();
        if(u.types)activeTypes=new Set(u.types.filter(t=>TYPE_LABEL[t]));

        syncChips();
        loadStateSummary().then(()=>{
            if(!u.lat&&navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{map.setView([pos.coords.latitude,pos.coords.longitude],11)},()=>onViewChange(),{timeout:4000})}else{onViewChange()}
        });
        setTimeout(()=>{if(!currentFacilities.length&&!stateSummaryCache)onViewChange()},2000);

        window.addEventListener('popstate',()=>{const s=getUrlState();if(!s.facilityId&&openFacilityId)closeFacilityInfo();else if(s.facilityId&&s.facilityId!==openFacilityId)openFacilityDetail(s.facilityId)});
        document.getElementById('loading').classList.add('hidden');

    async function loadStateSummary(){try{const{data,error}=await sb.from('state_summary').select('*');if(error)throw error;stateSummaryCache=data||[];dlog('state_summary:',stateSummaryCache.length,'rows')}catch(e){derr('state_summary failed:',e);stateSummaryCache=[]}}

    function onViewChange(){if(!map)return;const z=map.getZoom();if(z<STATE_ZOOM){if(currentViewMode!=='state'){clusterLayer.clearLayers();currentFacilities=[]}currentViewMode='state';renderStateBubbles()}else{if(currentViewMode!=='facility')stateBubbleLayer.clearLayers();currentViewMode='facility';fetchInView()}}

    function renderStateBubbles(){
        stateBubbleLayer.clearLayers();
        if(!stateSummaryCache||!stateSummaryCache.length)return;
        const agg={};
        stateSummaryCache.forEach(r=>{if(!activeTypes.has(r.facility_type))return;if(!agg[r.state])agg[r.state]={count:0,scoreSum:0,scoredCount:0};agg[r.state].count+=Number(r.facility_count);if(r.mean_score!=null&&r.scored_count>0){agg[r.state].scoreSum+=Number(r.mean_score)*Number(r.scored_count);agg[r.state].scoredCount+=Number(r.scored_count)}});
        const counts=Object.values(agg).map(a=>a.count);
        const maxCount=Math.max(...counts,1);
        let totalAll=0,scoreSumAll=0,scoredAll=0;
        Object.entries(agg).forEach(([st,d])=>{
            const si=STATE_BY_ABBR[st];if(!si)return;
            totalAll+=d.count;scoreSumAll+=d.scoreSum;scoredAll+=d.scoredCount;
            const avg=d.scoredCount>0?d.scoreSum/d.scoredCount:null;
            const bg=scoreToClassColor(avg);
            const minS=30,maxS=62;
            const logS=Math.log(d.count+1)/Math.log(maxCount+1);
            const size=Math.round(minS+logS*(maxS-minS));
            const fs=size<38?10:size<50?12:14;
            const cfs=Math.max(8,fs-3);
            const icon=L.divIcon({className:'',html:'<div class="state-bubble" style="width:'+size+'px;height:'+size+'px;background:'+bg+'"><span class="st-abbr" style="font-size:'+fs+'px;color:#2C3E50">'+st+'</span><span class="st-count" style="font-size:'+cfs+'px;color:#2C3E50">'+d.count.toLocaleString()+'</span></div>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
            const m=L.marker([si.lat,si.lng],{icon});
            m.on('click',()=>{map.setView([si.lat,si.lng],STATE_ZOOM)});
            const scoreStr=avg!=null?avg.toFixed(1):'—';
            m.bindTooltip('<strong>'+si.n+'</strong><br>'+d.count.toLocaleString()+' facilities · avg '+scoreStr,{direction:'top',offset:[0,-size/2-4]});
            stateBubbleLayer.addLayer(m);
        });
        document.getElementById('total-count').textContent=totalAll.toLocaleString();
        document.getElementById('avg-score').textContent=scoredAll>0?(scoreSumAll/scoredAll).toFixed(1):'—';
    }

    function createClusterIcon(cluster){
        const ch=cluster.getAllChildMarkers(),count=ch.length,size=count<20?40:count<100?48:56;
        const cnts={};ch.forEach(m=>{const c=m.options._classification||'Unrated';cnts[c]=(cnts[c]||0)+1});
        const r=size/2;let segs='',sa=0;
        CLASS_ORDER.forEach(cls=>{if(!cnts[cls])return;const pct=cnts[cls]/count,ea=sa+pct*360,lg=pct>.5?1:0,sr=sa*Math.PI/180,er=ea*Math.PI/180;
        const x1=r+r*Math.sin(sr),y1=r-r*Math.cos(sr),x2=r+r*Math.sin(er),y2=r-r*Math.cos(er);
        if(pct>=.999)segs+='<circle cx="'+r+'" cy="'+r+'" r="'+r+'" fill="'+CLASS_COLORS[cls]+'"/>';
        else segs+='<path d="M'+r+','+r+' L'+x1+','+y1+' A'+r+','+r+' 0 '+lg+' 1 '+x2+','+y2+' Z" fill="'+CLASS_COLORS[cls]+'"/>';sa=ea});
        return L.divIcon({html:'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">'+segs+'<circle cx="'+r+'" cy="'+r+'" r="'+(r*.6)+'" fill="var(--card-bg,#fff)"/><text x="'+r+'" y="'+r+'" text-anchor="middle" dominant-baseline="central" font-size="'+(size<48?11:13)+'" font-weight="700" fill="var(--text-primary,#2C3E50)">'+count+'</text></svg>',className:'cluster-pie',iconSize:[size,size],iconAnchor:[size/2,size/2]});
    }

    function buildFilterChips(){
        const sc=document.getElementById('chip-scroll');sc.innerHTML='';
        FACILITY_TYPES.forEach(t=>{const c=document.createElement('button');c.className='f-chip'+(activeTypes.has(t.value)?' active':'');c.dataset.type=t.value;c.setAttribute('role','switch');c.setAttribute('aria-checked',activeTypes.has(t.value));c.setAttribute('aria-label',t.label);c.type='button';c.innerHTML='<i class="fas '+t.icon+'" aria-hidden="true"></i> '+t.label;c.addEventListener('click',()=>{if(activeTypes.has(t.value))activeTypes.delete(t.value);else activeTypes.add(t.value);haptic(10);syncChips();onViewChange()});sc.appendChild(c)});

    function syncChips(){
        const hasH=activeTypes.has('hospital');
        document.querySelectorAll('.f-chip[data-type]').forEach(c=>{const a=activeTypes.has(c.dataset.type);c.classList.toggle('active',a);c.setAttribute('aria-checked',a)});
        document.querySelectorAll('.f-chip[data-spec]').forEach(c=>{const a=activeSpecialties[c.dataset.spec];c.classList.toggle('active',a);c.classList.toggle('disabled',!hasH);c.setAttribute('aria-checked',a);if(!hasH)c.setAttribute('data-tooltip','Hospitals only');else c.removeAttribute('data-tooltip')});
        const sd=document.getElementById('spec-divider');if(sd)sd.style.display=hasH?'':'none';
        pushUrlState(true);
    }

    async function fetchInView(){
        if(!map||!isOnline)return;
        const c=map.getCenter(),radius=getViewportRadiusMiles(),types=Array.from(activeTypes);
        dlog('fetchInView: center=('+c.lat.toFixed(4)+','+c.lng.toFixed(4)+'), radius='+radius+'mi, types=['+types.join(',')+'], zoom='+map.getZoom());
        if(!types.length){clusterLayer.clearLayers();currentFacilities=[];updateStats([]);showEmptyState('no-types');return}
        const params={p_lat:c.lat,p_lng:c.lng,p_radius_miles:radius,p_types:types,p_min_score:null,p_require_nicu:!!activeSpecialties.nicu,p_require_cath:!!activeSpecialties.cath,p_require_trauma:!!activeSpecialties.trauma,p_require_teaching:!!activeSpecialties.teaching,p_require_er:!!activeSpecialties.er,p_limit:5000};
        dlog('RPC params:',JSON.stringify(params));
        showLoading(true);
        try{if(inflightController)inflightController.abort();inflightController=new AbortController();
        const{data,error}=await sb.rpc('nearby_facilities',params);if(error)throw error;
        currentFacilities=data||[];dlog('RPC returned '+currentFacilities.length+' facilities');
        if(currentFacilities.length>0){const tc={};currentFacilities.forEach(f=>{tc[f.facility_type]=(tc[f.facility_type]||0)+1});dlog('Type breakdown:',JSON.stringify(tc))}
        renderMarkers(currentFacilities);updateStats(currentFacilities);
        const ov=document.getElementById('map-empty-overlay');if(ov&&currentFacilities.length>0)ov.remove();
        if(!currentFacilities.length)showEmptyState('no-results');
        }catch(e){if(e.name!=='AbortError'){derr('RPC failed:',e);showErrorState(e)}}finally{showLoading(false)}
    }

    function renderMarkers(facs){
        clusterLayer.clearLayers();const ds=isMobile?14:12;
        const markers=facs.map(f=>{if(f.latitude==null||f.longitude==null)return null;
        const color=classColor(f.score_classification);
        const icon=L.divIcon({className:'',html:'<div class="ftp-dot" style="background:'+color+';width:'+ds+'px;height:'+ds+'px"></div>',iconSize:[ds,ds],iconAnchor:[ds/2,ds/2]});
        const m=L.marker([f.latitude,f.longitude],{icon,_classification:f.score_classification||'Unrated',_facilityId:f.facility_id});
        if(isMobile)m.on('click',()=>openFacilityDetail(f.facility_id));
        else{m.bindPopup(buildPopup(f),{maxWidth:240});m.on('click',()=>openFacilityDetail(f.facility_id))}
        return m}).filter(Boolean);
        dlog('renderMarkers:',markers.length);clusterLayer.addLayers(markers);
    }

    function buildPopup(f){const s=f.final_score!=null?f.final_score.toFixed(1):'—';return'<div><strong>'+escapeHtml(f.facility_name||'')+'</strong><br><span style="color:var(--text-secondary);font-size:11px">'+escapeHtml(TYPE_LABEL[f.facility_type]||'')+'</span><br><span style="display:inline-block;padding:2px 8px;margin-top:4px;border-radius:10px;font-size:11px;font-weight:600;background:'+classColor(f.score_classification)+';color:#2C3E50">'+s+' · '+escapeHtml(f.score_classification||'Unrated')+'</span></div>'}
    function updateStats(rows){const sc=rows.filter(r=>r.final_score!=null);document.getElementById('total-count').textContent=rows.length.toLocaleString();document.getElementById('avg-score').textContent=sc.length>0?(sc.reduce((s,r)=>s+r.final_score,0)/sc.length).toFixed(1):'—'}

    function showEmptyState(reason){const el=document.getElementById('map-empty-overlay');if(el)el.remove();if(currentFacilities.length>0)return;const o=document.createElement('div');o.id='map-empty-overlay';o.className='empty-state';o.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:450;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:30px 40px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:calc(100% - 32px)';if(reason==='no-types')o.innerHTML='<i class="fas fa-filter"></i><h4>No types selected</h4><p>Enable at least one facility type.</p>';else o.innerHTML='<i class="fas fa-search"></i><h4>No facilities found</h4><p>Try zooming out or adjusting filters.</p><button class="clear-btn" type="button" onclick="clearAllFilters()">Clear Filters</button>';document.getElementById('map-page').appendChild(o)}
    function showErrorState(err){const el=document.getElementById('map-empty-overlay');if(el)el.remove();const o=document.createElement('div');o.id='map-empty-overlay';o.className='error-state';o.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:450;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:30px 40px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:calc(100% - 32px)';o.innerHTML='<i class="fas fa-triangle-exclamation"></i><h4>Unable to load</h4><p>'+escapeHtml(err.message||'Error')+'</p><button class="retry-btn" type="button" onclick="onViewChange();this.closest(\'.error-state\').remove()">Retry</button>';document.getElementById('map-page').appendChild(o)}
    function clearAllFilters(){activeTypes=new Set(FACILITY_TYPES.map(t=>t.value));Object.keys(activeSpecialties).forEach(k=>activeSpecialties[k]=false);syncChips();const o=document.getElementById('map-empty-overlay');if(o)o.remove();onViewChange()}
    function showLoading(a){const el=document.getElementById('query-loading');if(a)el.classList.add('active');else el.classList.remove('active')}

    async function openFacilityDetail(fid){
        openFacilityId=fid;pushUrlState(false);document.title='Loading… — ForThePatient';
        if(isMobile){document.getElementById('detail-sheet-body').innerHTML=buildSkeletonHtml();openBottomSheet('half')}
        else{const p=document.getElementById('info-panel');document.getElementById('facility-info-content').innerHTML=buildSkeletonHtml();p.classList.add('active')}
        const ov=document.getElementById('map-empty-overlay');if(ov)ov.remove();
        try{const{data,error}=await sb.rpc('facility_detail',{p_facility_id:fid});if(error)throw error;if(!data)throw new Error('No data');
        const html=buildFacilityDetailHtml(data);
        if(isMobile)document.getElementById('detail-sheet-body').innerHTML=html;else document.getElementById('facility-info-content').innerHTML=html;
        const f=data.facility||data;const s=f.final_score!=null?f.final_score.toFixed(1):'';document.title=(f.facility_name||'Facility')+' — Quality Score'+(s?' '+s:'')+' | ForThePatient';
        }catch(e){derr('detail failed',e);const eh='<div class="error-state"><i class="fas fa-triangle-exclamation"></i><h4>Could not load</h4><p>'+escapeHtml(e.message||'')+'</p><button class="retry-btn" type="button" onclick="openFacilityDetail(\''+escapeHtml(fid)+'\')">Retry</button></div>';if(isMobile)document.getElementById('detail-sheet-body').innerHTML=eh;else document.getElementById('facility-info-content').innerHTML=eh}
    }

    function buildSkeletonHtml(){return'<div class="facility-info" style="padding-top:14px"><div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:8px"><div class="skeleton-block" style="width:32px;height:32px;border-radius:6px"></div><div class="skeleton-block" style="width:32px;height:32px;border-radius:6px"></div><div class="skeleton-block" style="width:32px;height:32px;border-radius:6px"></div></div><div class="skeleton-block skeleton-line w70"></div><div class="skeleton-block skeleton-line w40" style="height:8px;margin-bottom:14px"></div><div style="display:flex;gap:14px;align-items:center;margin-bottom:20px"><div class="skeleton-block skeleton-circle"></div><div style="flex:1"><div class="skeleton-block skeleton-line w50"></div><div class="skeleton-block skeleton-line w40" style="height:8px"></div></div></div><div class="skeleton-block skeleton-line w40" style="height:8px;margin-bottom:14px"></div><div class="skeleton-block skeleton-line w90"></div><div class="skeleton-block skeleton-bar"></div><div class="skeleton-block skeleton-line w90"></div><div class="skeleton-block skeleton-bar"></div><div class="skeleton-block skeleton-line w90"></div><div class="skeleton-block skeleton-bar"></div><div class="skeleton-block skeleton-line w90"></div><div class="skeleton-block skeleton-bar"></div><div style="margin-top:18px"><div class="skeleton-block skeleton-line w70"></div><div class="skeleton-block skeleton-line w50"></div></div></div>'}

    function buildFacilityDetailHtml(payload){
        const f=payload.facility||payload,comps=payload.components||[],enf=payload.enforcement||[];
        const score=f.final_score!=null?f.final_score.toFixed(1):'—',cls=f.score_classification||'Unrated',stars=f.cms_overall_rating||null;
        const compHtml=comps.length===0?'<div class="component-na">No component data</div>':comps.sort((a,b)=>(a.component_order||0)-(b.component_order||0)).map(c=>{const cs=c.component_score!=null?c.component_score.toFixed(1):'—';const wt=c.component_weight!=null?Math.round(c.component_weight*100)+'%':'';const fp=c.component_score!=null?Math.max(0,Math.min(100,(c.component_score/10)*100)):0;return'<div><div class="component-row"><div class="component-name">'+escapeHtml(c.component_name||'')+'</div><div class="component-weight">'+wt+'</div><div class="component-score">'+cs+'</div></div><div class="component-bar"><div class="component-bar-fill" style="width:'+fp+'%;background:'+scoreToBarColor(c.component_score)+'"></div></div></div>'}).join('');
        const badges=[];if(truthy(f.teaching_status))badges.push('Teaching');if(truthy(f.has_cardiac_cath_lab))badges.push('Cardiac Cath');if(truthy(f.has_cardiac_surgery))badges.push('Cardiac Surgery');if(truthy(f.nicu_level))badges.push('NICU');if(truthy(f.has_trauma_center))badges.push('Trauma Center');if(truthy(f.has_burn_unit))badges.push('Burn Unit');if(truthy(f.has_organ_transplant))badges.push('Transplant');if(truthy(f.has_mri))badges.push('MRI');if(f.case_mix_index!=null)badges.push('CMI '+Number(f.case_mix_index).toFixed(2));
        const bHtml=badges.length?'<div class="specialty-badges">'+badges.map(b=>'<span class="spec-badge">'+escapeHtml(b)+'</span>').join('')+'</div>':'';
        const eHtml=enf.length?'<div class="enforcement-block"><div class="enforcement-title"><i class="fas fa-gavel"></i> '+enf.length+' regulatory action'+(enf.length===1?'':'s')+'</div>'+enf.slice(0,5).map(e=>'<div class="enforcement-amt">'+escapeHtml(e.penalty_type||'Penalty')+(e.amount?' · $'+Number(e.amount).toLocaleString():'')+(e.penalty_date?' · '+escapeHtml(String(e.penalty_date).slice(0,10)):'')+'</div>').join('')+(enf.length>5?'<div class="enforcement-amt">+ '+(enf.length-5)+' more</div>':'')+'</div>':'';
        const cmsLine=stars?'<span class="cms-stars">CMS overall: '+'<i class="fas fa-star star-icon"></i>'.repeat(Math.round(stars))+' '+stars+'/5</span>':'';
        return'<div class="facility-info"><div class="detail-header-actions"><button class="detail-action-btn" type="button" onclick="copyFacilityLink(\''+escapeHtml(f.facility_id)+'\')" aria-label="Copy link" title="Copy link"><i class="fas fa-link"></i></button><button class="detail-action-btn" type="button" onclick="shareFacility(\''+escapeHtml(f.facility_id)+'\',\''+escapeHtml(f.facility_name)+'\')" aria-label="Share" title="Share"><i class="fas fa-share-nodes"></i></button><button class="detail-action-btn" type="button" data-pin onclick="togglePinPanel()" aria-label="Pin" title="Pin"><i class="fas fa-thumbtack"></i></button><button class="detail-action-btn" type="button" onclick="closeFacilityInfo()" aria-label="Close" title="Close"><i class="fas fa-times"></i></button></div><div class="facility-header"><h2 class="facility-name">'+escapeHtml(f.facility_name||'')+'</h2><div class="facility-type-line">'+escapeHtml(TYPE_LABEL[f.facility_type]||f.facility_type||'')+'</div><div class="score-block"><div class="score-circle '+(cls==='Unrated'?'unrated':'')+'" style="background:'+classColor(cls)+'">'+score+'</div><div class="score-meta"><span class="classification-badge '+classBadgeClass(cls)+'" style="background:'+classColor(cls)+'">'+escapeHtml(cls)+'</span><span class="score-out-of">FTP score · 10-point scale</span>'+cmsLine+'</div></div>'+bHtml+'</div><h3 class="section-header">Component breakdown</h3>'+compHtml+eHtml+'<div class="addr-block">'+(f.address?'<div><i class="fas fa-map-marker-alt"></i>'+escapeHtml(f.address||'')+'</div>':'')+'<div style="padding-left:20px">'+escapeHtml(f.city||'')+(f.city?', ':'')+escapeHtml(f.state||'')+' '+escapeHtml(f.zip_code||'')+'</div>'+(f.phone?'<div><i class="fas fa-phone"></i>'+escapeHtml(f.phone)+'</div>':'')+'</div><a href="https://maps.google.com/?q='+f.latitude+','+f.longitude+'" target="_blank" rel="noopener noreferrer" class="directions-btn">Get Directions</a><div class="print-methodology-url">Methodology: https://forthepatient.org/methodology</div></div>';
    }

    function closeFacilityInfo(){
        openFacilityId=null;
        document.title='For The Patient — Healthcare Quality Map';
        if(isMobile)closeBottomSheet();
        else document.getElementById('info-panel').classList.remove('active','pinned');
        pushUrlState(true);
    }
    function copyFacilityLink(id){const url=location.origin+location.pathname+'?fid='+encodeURIComponent(id);navigator.clipboard.writeText(url).then(()=>{const b=document.querySelector('.detail-action-btn[onclick*="copyFacilityLink"]');if(b){const i=b.querySelector('i');i.className='fas fa-check';setTimeout(()=>{i.className='fas fa-link'},1500)}}).catch(()=>{})}
    function shareFacility(id,name){const url=location.origin+location.pathname+'?fid='+encodeURIComponent(id);if(navigator.share)navigator.share({title:name+' — Quality Score | ForThePatient',url}).catch(()=>{});else copyFacilityLink(id)}
    function togglePinPanel(){const p=document.getElementById('info-panel');detailPanelPinned=!detailPanelPinned;p.classList.toggle('pinned',detailPanelPinned);if(detailPanelPinned)p.style.width='';setTimeout(()=>map.invalidateSize(),350)}

    function wireNameSearch(){
        const input=document.getElementById('name-search'),results=document.getElementById('name-results');if(!input||!results)return;let kbIdx=-1;
        const search=debounce(async()=>{const q=input.value.trim();if(q.length<2){results.classList.remove('active');input.setAttribute('aria-expanded','false');return}if(!isOnline)return;
        try{const{data,error}=await sb.rpc('search_facilities_by_name',{p_query:q,p_limit:12});if(error)throw error;renderNameResults(data||[],results);input.setAttribute('aria-expanded','true');kbIdx=-1}catch(e){derr('search failed',e)}},250);
        input.addEventListener('input',search);
        input.addEventListener('focus',()=>{if(results.children.length>0){results.classList.add('active');input.setAttribute('aria-expanded','true')}});
        input.addEventListener('keydown',e=>{const items=results.querySelectorAll('.name-result-item');if(e.key==='ArrowDown'){e.preventDefault();kbIdx=Math.min(kbIdx+1,items.length-1);updateKbActive(items,kbIdx)}else if(e.key==='ArrowUp'){e.preventDefault();kbIdx=Math.max(kbIdx-1,-1);updateKbActive(items,kbIdx)}else if(e.key==='Enter'&&kbIdx>=0&&items[kbIdx]){e.preventDefault();items[kbIdx].click()}else if(e.key==='Escape'){results.classList.remove('active');input.setAttribute('aria-expanded','false')}});
        document.addEventListener('click',e=>{if(!e.target.closest('.search-compact')){results.classList.remove('active');input.setAttribute('aria-expanded','false')}});
    }
    function updateKbActive(items,idx){items.forEach((el,i)=>{el.classList.toggle('kb-active',i===idx);if(i===idx)el.scrollIntoView({block:'nearest'})})}
    function renderNameResults(rows,el){
        if(!rows.length){el.innerHTML='<div class="name-result-item"><div class="name-result-meta">No matches</div></div>';el.classList.add('active');return}
        el.innerHTML=rows.map((r,i)=>{const sc=classColor(r.score_classification),st=r.final_score!=null?r.final_score.toFixed(1):'—';return'<div class="name-result-item" data-id="'+escapeHtml(r.facility_id)+'" data-lat="'+r.latitude+'" data-lng="'+r.longitude+'" role="option"><div class="name-result-name">'+escapeHtml(r.facility_name||'')+'</div><div class="name-result-meta">'+escapeHtml(TYPE_LABEL[r.facility_type]||'')+' · '+escapeHtml(r.city||'')+', '+escapeHtml(r.state||'')+' · <span class="name-result-score" style="background:'+sc+'">'+st+'</span></div></div>'}).join('');
        el.classList.add('active');
        el.querySelectorAll('.name-result-item[data-id]').forEach(el=>{el.addEventListener('click',()=>{const lat=parseFloat(el.dataset.lat),lng=parseFloat(el.dataset.lng);if(!isNaN(lat)&&!isNaN(lng))map.setView([lat,lng],14);document.getElementById('name-results').classList.remove('active');document.getElementById('name-search').value='';openFacilityDetail(el.dataset.id)})});
    }

    function wireResizeHandle(){const h=document.getElementById('resize-handle'),p=document.getElementById('info-panel');if(!h||!p)return;let sx,sw;function md(e){e.preventDefault();sx=e.clientX;sw=p.offsetWidth;document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu)}function mm(e){p.style.width=Math.max(320,Math.min(600,sw+(sx-e.clientX)))+'px'}function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu)}h.addEventListener('mousedown',md)}

    function toggleTheme(){currentTheme=currentTheme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',currentTheme);try{localStorage.setItem('theme',currentTheme)}catch(e){}const btn=document.getElementById('theme-toggle-btn');btn.classList.toggle('active',currentTheme==='dark');btn.setAttribute('aria-checked',currentTheme==='dark');btn.querySelector('.toggle-slider i').className=currentTheme==='dark'?'fas fa-moon':'fas fa-sun';document.querySelector('meta[name="theme-color"]').content=currentTheme==='dark'?'#1A1F36':'#FDF8F0';map.eachLayer(l=>{if(l instanceof L.TileLayer)map.removeLayer(l)});L.tileLayer(currentTheme==='dark'?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO &middot; CMS public data',subdomains:'abcd',maxZoom:20}).addTo(map);pushUrlState(true)}

    // ─── Bottom sheet (mobile only) ──────────────────────────────────────────
    function getSnapHeights(){const vh=window.innerHeight;return{half:Math.round(vh*0.5),full:Math.round(vh*0.9)}}
    function applySheetHeight(h,animate){const sheet=document.getElementById('detail-sheet');if(!sheet)return;sheet.style.transition=animate?'height .3s cubic-bezier(.25,.1,.25,1)':'none';sheet.style.height=Math.max(0,h)+'px'}
    function openBottomSheet(snap){
        const sheet=document.getElementById('detail-sheet');if(!sheet)return;
        const heights=getSnapHeights();const h=heights[snap]||heights.half;
        sheetState=(snap==='full')?'full':'half';
        sheet.setAttribute('aria-hidden','false');
        applySheetHeight(h,true);
    }
    function closeBottomSheet(){
        const sheet=document.getElementById('detail-sheet');if(!sheet)return;
        if(sheetState==='closed'){applySheetHeight(0,false);return}
        sheetState='closed';
        sheet.setAttribute('aria-hidden','true');
        applySheetHeight(0,true);
        setTimeout(()=>{
            if(sheetState==='closed'){
                const body=document.getElementById('detail-sheet-body');
                if(body)body.innerHTML='';
            }
        },350);
    }
    function setupBottomSheetHandle(){
        const sheet=document.getElementById('detail-sheet');
        const oldHandle=document.getElementById('detail-sheet-handle');
        if(!sheet||!oldHandle)return;
        // Replace the handle with a fresh clone to drop any stale listeners.
        const handle=oldHandle.cloneNode(false);
        oldHandle.parentNode.replaceChild(handle,oldHandle);
        let sY,sH,drag=false;
        handle.addEventListener('touchstart',e=>{
            drag=true;sY=e.touches[0].clientY;sH=sheet.offsetHeight;
            sheet.style.transition='none';
        },{passive:true});
        handle.addEventListener('touchmove',e=>{
            if(!drag)return;
            const heights=getSnapHeights();
            const newH=Math.min(heights.full,Math.max(0,sH+(sY-e.touches[0].clientY)));
            applySheetHeight(newH,false);
        },{passive:true});
        handle.addEventListener('touchend',()=>{
            if(!drag)return;drag=false;
            const heights=getSnapHeights();
            const h=sheet.offsetHeight;
            const cands=[['closed',0],['half',heights.half],['full',heights.full]];
            cands.sort((a,b)=>Math.abs(h-a[1])-Math.abs(h-b[1]));
            const best=cands[0][0];
            if(best==='closed'){
                openFacilityId=null;
                document.title='For The Patient — Healthcare Quality Map';
                pushUrlState(true);
                closeBottomSheet();
            }else{
                openBottomSheet(best);
            }
            haptic(10);
        },{passive:true});

        // Wire the always-on close button (idempotent via _wired flag).
        const closeBtn=document.getElementById('sheet-close-btn');
        if(closeBtn&&!closeBtn._wired){
            closeBtn._wired=true;
            closeBtn.addEventListener('click',()=>{
                openFacilityId=null;
                document.title='For The Patient — Healthcare Quality Map';
                pushUrlState(true);
                closeBottomSheet();
            });
        }
    }
    // Compatibility shim — older code paths still call setSheetSnap.
    function setSheetSnap(sid,snap){if(sid!=='detail-sheet')return;if(snap===0||snap==='closed')closeBottomSheet();else openBottomSheet(snap==='full'?'full':'half')}

    function handleViewportResize(){
        checkMobile();
        if(isMobile){
            setupBottomSheetHandle();
            if(sheetState!=='closed'){
                const heights=getSnapHeights();
                applySheetHeight(heights[sheetState]||heights.half,false);
            }
        }else if(sheetState!=='closed'){
            // Crossed mobile->desktop while open: tear sheet down.
            sheetState='closed';
            applySheetHeight(0,false);
            const body=document.getElementById('detail-sheet-body');if(body)body.innerHTML='';
        }
        if(map)map.invalidateSize();
    }

    function setupOfflineDetection(){const t=document.getElementById('offline-toast');window.addEventListener('offline',()=>{isOnline=false;t.classList.add('active')});window.addEventListener('online',()=>{isOnline=true;t.classList.remove('active');onViewChange()})}
    function setupKeyboardShortcuts(){document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.target.closest('input,select,textarea')){e.preventDefault();document.getElementById('name-search')?.focus()}if(e.key==='Escape'&&openFacilityId)closeFacilityInfo()})}

    window.addEventListener('load',()=>{
        checkMobile();
        const debouncedResize=debounce(handleViewportResize,150);
        window.addEventListener('resize',debouncedResize);
        window.addEventListener('orientationchange',()=>{setTimeout(handleViewportResize,250)});
        const u=getUrlState();
        const saved=u.theme||(function(){try{return localStorage.getItem('theme')}catch(e){return null}})()||'light';
        currentTheme=saved;
        document.documentElement.setAttribute('data-theme',currentTheme);
        if(currentTheme==='dark'){
            const b=document.getElementById('theme-toggle-btn');
            b.classList.add('active');b.setAttribute('aria-checked','true');
            b.querySelector('.toggle-slider i').className='fas fa-moon';
            document.querySelector('meta[name="theme-color"]').content='#1A1F36';
        }
        initMap();
        setupOfflineDetection();
        setupKeyboardShortcuts();
        if(isMobile)setupBottomSheetHandle();
    });
    </script>
</body>
