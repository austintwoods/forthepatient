<!--
  ForThePatient.org v5.2 (Session ENF-VIZ — June 2026)
  Enforcement visualization. Pure frontend; no backend/scoring/schema changes.
  All B-ENF-FLAG data (has_active_enforcement, enforcement_severity gated in
  nearby_facilities / ungated in facility_detail, hospital_enforcement[]) is
  live + anon-verified — this session only RENDERS it.
  Changelog vs v5.1:
    EV-1: SEVERITY-WEIGHTED MAP MARKERS. Flagged facilities (has_active_enforcement)
          get a colored RING around the score dot, weighted by the 4-tier
          enforcement_severity {CRITICAL,SEVERE,MODERATE,MINOR}. The dot fill keeps
          the score-classification color (so the quality signal is unchanged); the
          RING answers "is something wrong here". CRITICAL pulses (reduced-motion
          aware) + loudest; MINOR is a thin subtle ring. To keep the ~10,311 flagged
          markers from overwhelming the state view, MODERATE/MINOR rings only appear
          at zoom >= 11; CRITICAL/SEVERE always show when flagged. Ring colors are
          the documented classification palette (#E8A0A0/#F0B8A0/#F8D08A/#BDC3C7) —
          NO new colors (Invariant #18). Still L.divIcon, never circleMarker (#7);
          severity normalized in JS, colors hard-coded in the divIcon HTML (#8).
          enforcement_severity is null for unflagged facilities → normal marker,
          never treated as a category.
    EV-2: DETAIL-CARD ENFORCEMENT. New buildEnforcementHtml() renders, after the
          component breakdown: (a) a severity banner — "Under active enforcement ·
          <severity>" when flagged; when NOT flagged but a facility.enforcement_severity
          is present (the UNGATED expired label) a quiet "No active enforcement / a
          past finding has expired" banner so an expired label is NEVER shown as
          current; and (b) a "Survey findings (N)" history from hospital_enforcement[]
          — per-survey date, level (Immediate jeopardy / Condition-level / Standard
          from the 3-tier {critical,significant,minor}), a Current|Resolved status
          from is_active, optional tag + description, sorted survey_date desc, first
          4 shown with a Show-all toggle. Renders in BOTH the desktop side panel and
          the mobile sheet detail mode (buildFacilityDetailHtml feeds both). All
          enforcement text routed through escapeHtml (#15).
    EV-3: MOBILE FLAGGED PILL is now severity-aware (Decision 127 allows ENF-VIZ to
          upgrade it): the pill color tracks the 4-tier severity. Desktop popup gains
          an "Active enforcement · <severity>" line.
    EV-4: No backend, scoring, schema, or methodology-CODE changes. No new
          dependencies. methodology.html updated separately (Known Issues #4).
          Desktop (>768px) layout otherwise byte-for-byte unchanged (Hard Invariant
          #29); sheet/modes/snaps/toggle/theme toggle preserved (#30).
  v5.1 changelog (Session K5-MOBILE-FT) carried forward:
    FT-1: "NEAR ME" BEHAVIOR (Known Issues #14; wireNearMe). Rewritten as a
          small state machine with a single in-flight request guard, so rapid
          repeat taps can no longer stack getCurrentPosition calls or leave the
          spinner stuck. The spinner + aria-busy are set the instant the button
          is tapped and reliably restored on EVERY exit path (success, denial,
          timeout, slow-then-granted). On success: recenter at zoom 11, snap to
          half, re-render the nearby list. On denial: show the location-off
          guide (Invariant #11 silent-map-fallback preserved). On the 4s TIMEOUT
          (slow GPS, Q-42 = explicit-retry): keep a background watchPosition
          alive so a late fix still recenters automatically, AND show an explicit
          "Still finding your location… / Try again" affordance in the sheet.
    FT-2: NEARBY LIST + SEARCH DROPDOWN DISPLAY (Known Issues #15). Hardened for
          320/360/390/414px: list rows now truncate the NAME first (ellipsis)
          while the distance and FLAGGED pill stay pinned right and never wrap
          (flex 0 0 auto + min-widths). The search dropdown (#sheet-search-results)
          now layers above the chips/stats/list (z-index + card bg + shadow) and
          scrolls when long (max-height) with its existing explicit empty state.
          List cap stays at 60 with the "Showing the nearest 60 of N" footer.
    FT-3: No backend, scoring, schema, or methodology changes. No new
          dependencies, no new colors. B-ENF-FLAG fields still surfaced only as
          the minimal FLAGGED pill — severity-weighted markers and percentile
          copy remain ENF-VIZ / TRANSLATE-1 (Decision 127). Desktop (>768px)
          byte-for-byte unchanged (Hard Invariant #29).
  v5.0 changelog (Session K5-MOBILE) carried forward:
    K5-1: MOBILE CONTROL MODEL INVERTED. The cramped floating top filter bar
          (search + chips + stats) is hidden on phones (<=768px). Its job moves
          into a persistent bottom "home sheet" that rests at a low PEEK and
          pulls up to HALF/FULL. Desktop (>768px) is UNCHANGED — it keeps the
          floating filter bar and the side info-panel.
    K5-2: The home sheet holds, in reading order: a List/Map segmented toggle,
          a full-width search field (no longer a 120px sliver — fixes S-2 #1),
          a "Near me" button, the seven facility-type chips wrapped so all are
          visible with active state obvious (S-2 #2), labeled stats
          "N hospitals nearby - avg 5.8/10" (S-2 #4), and a distance-sorted
          list of nearby facilities (each row: score, type, classification,
          distance, enforcement flag).
    K5-3: List/Map TAB. Tapping "Map" drops the sheet to peek (near-full map);
          "List" raises it to half. The toggle reflects the current snap, and
          dragging the handle keeps it in sync. This is the "keep a Map tab"
          blend on top of layout A.
    K5-4: FIRST-USE GUIDANCE (S-2 #3). The peek rail (search + Near me) is the
          resting state, not a popup. The list area shows plain guidance copy
          for every empty/zero/denied case, and a one-line score legend
          (S-2 #5 — bubbles are no longer the only way to read the data).
    K5-5: The bottom sheet now has two MODES (home / detail) sharing one
          surface. Tapping any facility (marker, list row, or search result)
          swaps the sheet to the existing detail view; closing returns to the
          list rather than dismissing the sheet. Legal links live at the foot
          of the home sheet (the floating footer bar is hidden on mobile).
    K5-6: Light/dark theme toggle retained in the header exactly as before.
  Earlier changelogs (v4.1 K1, v4.2 K2, v4.3 K3) trimmed from this header at
  ENF-VIZ to keep the single file readable and under the 1,000-line code budget
  (Hard Invariant #16 / Decision 131). The full per-session history lives in
  SESSION_HANDOFF.md (Session Execution History) and in git. Summary of what
  those sessions established and is still in force: state-bubble default view
  + geolocation centering (K2); Hospitals-only default + specialty chips removed
  (K2); client-side state scoping + dismissible state badge (K2); early <head>
  theme init, JS-resolved cluster SVG colors, state-filter-aware empty state,
  Method nav hidden <=380px (K3); 16px mobile inputs, >=40px touch targets,
  DEBUG-gated console, resize/orientation re-snap, inline About removed,
  header anchors (K1).
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>For The Patient — Healthcare Quality Map</title>
    <meta name="description" content="Independent quality scores for 48,000+ Medicare-certified facilities. Hospitals, nursing homes, dialysis, home health, hospice, IRF, LTCH. Built from compulsory CMS data. Zero industry funding.">
    <meta name="theme-color" content="#FDF8F0">
    <script>
    // Early theme init: apply persisted theme before body renders to prevent flash.
    (function(){try{var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('meta[name="theme-color"]').content='#1A1F36'}}catch(e){}})();
    </script>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://nhajnwffxlztmoadqcdl.supabase.co">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg:#FDF8F0;--card-bg:#FFFFFF;--accent:#5B85C7;--text-primary:#2C3E50;--text-secondary:#7F8C8D;--border:#E1E8ED;--hover-bg:rgba(91,133,199,0.1);--button-hover:rgba(91,133,199,0.15);--focus-ring:rgba(91,133,199,0.45);--skeleton-base:#E1E8ED;--skeleton-shine:#F5F5F5;--cls-poor:#E8A0A0;--cls-below:#F0B8A0;--cls-average:#F8D08A;--cls-above:#B8E6A0;--cls-excep:#A0D8A0;--cls-unrated:#BDC3C7;--header-h:56px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--detail-w:380px}
        [data-theme="dark"]{--bg:#1A1F36;--card-bg:#2C3E50;--accent:#7FB3D3;--text-primary:#ECF0F1;--text-secondary:#BDC3C7;--border:#34495E;--hover-bg:rgba(127,179,211,0.1);--button-hover:rgba(127,179,211,0.15);--focus-ring:rgba(127,179,211,0.45);--skeleton-base:#34495E;--skeleton-shine:#3D5166}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400;background:var(--bg);color:var(--text-primary);overflow:hidden;height:100vh;height:100dvh;width:100vw;line-height:1.5;transition:background-color .3s,color .3s;overscroll-behavior:none}
        :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}
        :focus:not(:focus-visible){outline:none}

        .header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:calc(var(--header-h) + var(--safe-top));padding-top:var(--safe-top);transition:all .3s}
        [data-theme="dark"] .header{background:rgba(44,62,80,.95)}
        .header-inner{max-width:1400px;margin:0 auto;padding:0 16px;padding-left:calc(16px + var(--safe-left));padding-right:calc(16px + var(--safe-right));display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:8px}
        .logo-link{display:flex;align-items:baseline;text-decoration:none;color:inherit;min-width:0}
        .logo{font-size:1.15rem;font-weight:600;color:var(--text-primary);letter-spacing:-.02em;white-space:nowrap}
        .logo-sub{font-size:.68rem;color:var(--text-secondary);font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin-left:8px;white-space:nowrap}
        .header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-btn{color:var(--text-secondary);text-decoration:none;font-size:.8rem;font-weight:500;padding:6px 10px;border-radius:6px;border:none;background:none;cursor:pointer;font-family:inherit;transition:color .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;min-height:32px}
        .nav-btn:hover,.nav-btn.active{color:var(--accent);background:var(--hover-bg)}
        .toggle-switch{position:relative;width:44px;height:26px;background:var(--border);border-radius:13px;cursor:pointer;transition:background .3s;border:none;min-width:44px;flex-shrink:0}
        .toggle-switch.active{background:var(--accent)}
        .toggle-slider{position:absolute;top:2px;left:2px;width:22px;height:22px;background:var(--card-bg);border-radius:50%;transition:transform .3s;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text-secondary)}
        .toggle-switch.active .toggle-slider{transform:translateX(18px)}

        .main{margin-top:calc(var(--header-h) + var(--safe-top));height:calc(100vh - var(--header-h) - var(--safe-top));height:calc(100dvh - var(--header-h) - var(--safe-top));position:relative;overflow:hidden}
        #map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);touch-action:none}

        .filter-bar{position:absolute;top:12px;left:12px;right:12px;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;padding:8px 12px;box-shadow:0 2px 16px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;transition:all .3s}
        [data-theme="dark"] .filter-bar{background:rgba(44,62,80,.92)}
        .search-compact{position:relative;flex-shrink:0}
        .search-compact input{width:180px;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--card-bg);color:var(--text-primary);font-family:inherit;transition:border-color .2s,width .3s;min-height:36px}
        .search-compact input:focus{border-color:var(--accent);width:240px}
        .search-compact .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--text-secondary);pointer-events:none}
        .search-compact .name-results{position:absolute;top:100%;left:0;width:320px;max-width:calc(100vw - 24px - var(--safe-left) - var(--safe-right));background:var(--card-bg);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:280px;overflow-y:auto;display:none;z-index:600}
        .search-compact .name-results.active{display:block}
        .filter-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
        .chip-scroll-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
        .chip-scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0;padding-right:2px}
        .chip-scroll::-webkit-scrollbar{display:none}
        .f-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:16px;font-size:.72rem;font-weight:500;cursor:pointer;background:var(--card-bg);color:var(--text-secondary);transition:all .15s;user-select:none;white-space:nowrap;min-height:32px;flex-shrink:0;font-family:inherit}
        .f-chip:hover{background:var(--hover-bg);color:var(--text-primary)}
        .f-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .f-chip.spec{border-style:dashed}
        .f-chip.spec.active{border-style:solid}
        .f-chip.disabled{opacity:.35;cursor:default}
        .f-chip i{font-size:.68rem}
        .stats-inline{display:flex;gap:10px;align-items:center;flex-shrink:0;margin-left:auto;font-size:.72rem;color:var(--text-secondary);white-space:nowrap}
        .stats-inline strong{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
        .stats-inline .stat-item{display:inline-flex;align-items:center;gap:3px}
        .stats-inline .stat-item + .stat-item::before{content:"·";opacity:.5;margin-right:4px;font-weight:400}

        .state-filter-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:.72rem;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit;line-height:1;transition:opacity .15s,background .15s;min-height:30px}
        .state-filter-badge:hover{opacity:.9}
        .state-filter-badge .state-filter-x{font-size:.7rem;opacity:.85;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.18)}
        .state-filter-badge[hidden]{display:none!important}

        .info-panel{position:absolute;top:68px;right:12px;width:var(--detail-w);max-height:calc(100dvh - var(--header-h) - var(--safe-top) - 100px);overflow-y:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);z-index:450;display:none;transition:all .3s}
        .info-panel.active{display:block}
        .info-panel.pinned{top:0;right:0;height:100%;max-height:100%;border-radius:0;border-right:none;border-top:none;border-bottom:none}
        .resize-handle{position:absolute;top:0;left:-4px;width:8px;height:100%;cursor:col-resize;z-index:10}
        .resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:32px;border-radius:2px;background:var(--border);opacity:0;transition:opacity .2s}
        .resize-handle:hover::after,.resize-handle:active::after{opacity:1}

        .facility-info{padding:22px;position:relative;padding-top:14px;padding-left:max(22px,calc(22px + var(--safe-left)));padding-right:max(22px,calc(22px + var(--safe-right)))}
        .detail-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-bottom:8px}
        .detail-action-btn{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:6px 8px;border-radius:6px;transition:all .2s;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;font-family:inherit}
        .detail-action-btn:hover{background:var(--hover-bg);color:var(--text-primary)}
        .facility-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
        .facility-name{font-size:1.1rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
        .facility-type-line{font-size:.72rem;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
        .score-block{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap}
        .score-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:700;color:#2C3E50;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .score-circle.unrated{color:var(--text-secondary)}
        .score-meta{flex:1;min-width:0}
        .classification-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.72rem;font-weight:600;color:#2C3E50}
        .classification-badge.unrated{color:var(--text-secondary);background:var(--cls-unrated)}
        .score-out-of{display:block;font-size:.72rem;color:var(--text-secondary);margin-top:4px}
        .cms-stars{display:block;font-size:.72rem;color:var(--text-secondary);margin-top:2px}
        .cms-stars .star-icon{color:#f5b80b}
        .section-header{font-size:.72rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
        .component-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
        .component-row:last-child{border-bottom:none}
        .component-name{color:var(--text-primary);min-width:0;overflow-wrap:anywhere}
        .component-weight{color:var(--text-secondary);font-size:.72rem}
        .component-score{font-weight:600;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
        .component-bar{grid-column:1/-1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
        .component-bar-fill{height:100%;border-radius:2px;transition:width .3s}
        .component-na{color:var(--text-secondary);font-style:italic;font-size:.75rem}
        .specialty-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
        .spec-badge{font-size:.68rem;padding:3px 8px;background:var(--hover-bg);color:var(--accent);border-radius:10px;font-weight:500}
        .enforcement-block{margin-top:14px;padding:12px;background:rgba(232,160,160,.12);border:1px solid rgba(232,160,160,.4);border-radius:8px;font-size:.78rem}
        .enforcement-title{font-weight:600;color:var(--text-primary);margin-bottom:4px}
        .enforcement-amt{font-size:.7rem;color:var(--text-secondary)}
        .addr-block{margin-top:16px;font-size:.8rem;color:var(--text-secondary);line-height:1.55;overflow-wrap:anywhere}
        .addr-block i{width:16px;color:var(--accent);margin-right:4px}
        .directions-btn{display:block;text-align:center;margin-top:16px;padding:12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-size:.875rem;font-weight:500;min-height:48px;line-height:24px}

        .name-result-item{padding:12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.82rem;min-height:48px;display:flex;flex-direction:column;justify-content:center}
        .name-result-item:last-child{border-bottom:none}
        .name-result-item:hover,.name-result-item.kb-active{background:var(--hover-bg)}
        .name-result-name{font-weight:600;color:var(--text-primary)}
        .name-result-meta{font-size:.72rem;color:var(--text-secondary);margin-top:2px}
        .name-result-score{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.68rem;font-weight:600;color:#2C3E50}

        .state-bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:'Inter',-apple-system,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);border:2px solid rgba(255,255,255,.8)}
        .state-bubble:hover{transform:scale(1.12);box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:1000!important}
        .state-bubble .st-abbr{font-weight:700;line-height:1}
        .state-bubble .st-count{font-weight:500;opacity:.85;line-height:1}
        [data-theme="dark"] .state-bubble{border-color:rgba(255,255,255,.3)}
        .ftp-dot{border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;transition:transform .1s}
        .ftp-dot:hover{transform:scale(1.3);z-index:1000!important}
        .marker-cluster{background:none!important}
        .marker-cluster div{width:36px;height:36px;margin-left:2px;margin-top:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#2C3E50;background:var(--cls-average);box-shadow:0 1px 6px rgba(0,0,0,.15)}
        .marker-cluster-small div{background:var(--cls-above)}
        .marker-cluster-medium div{background:var(--cls-average)}
        .marker-cluster-large div{background:var(--cls-below)}
        .cluster-pie{position:absolute;top:0;left:0}

        @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
        .skeleton-block{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-shine) 50%,var(--skeleton-base) 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px}
        .skeleton-circle{width:64px;height:64px;border-radius:50%}
        .skeleton-line{height:12px;margin-bottom:8px}
        .skeleton-line.w70{width:70%}.skeleton-line.w50{width:50%}.skeleton-line.w90{width:90%}.skeleton-line.w40{width:40%}
        .skeleton-bar{height:4px;width:100%;margin-top:6px}

        /* ── v5.0 mobile home sheet (control center) ───────────────────── */
        .sheet-home{display:flex;flex-direction:column;flex:1;min-height:0}

        .sheet-list{display:flex;flex-direction:column}
        .sheet-frow{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;width:100%;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}

        /* Mobile FLAGGED pill upgraded to severity-aware (Decision 127) */

    function renderStateBubbles(){
        stateBubbleLayer.clearLayers();
        if(!stateSummaryCache||!stateSummaryCache.length)return;
        const agg={};
        stateSummaryCache.forEach(r=>{if(!activeTypes.has(r.facility_type))return;if(!agg[r.state])agg[r.state]={count:0,scoreSum:0,scoredCount:0};agg[r.state].count+=Number(r.facility_count);if(r.mean_score!=null&&r.scored_count>0){agg[r.state].scoreSum+=Number(r.mean_score)*Number(r.scored_count);agg[r.state].scoredCount+=Number(r.scored_count)}});
        const counts=Object.values(agg).map(a=>a.count);
        const maxCount=Math.max(...counts,1);
        let totalAll=0,scoreSumAll=0,scoredAll=0;
        Object.entries(agg).forEach(([st,d])=>{
            const si=STATE_BY_ABBR[st];if(!si)return;
            totalAll+=d.count;scoreSumAll+=d.scoreSum;scoredAll+=d.scoredCount;
            const avg=d.scoredCount>0?d.scoreSum/d.scoredCount:null;
            const bg=scoreToClassColor(avg);
            const minS=30,maxS=62;
            const logS=Math.log(d.count+1)/Math.log(maxCount+1);
            const size=Math.round(minS+logS*(maxS-minS));
            const fs=size<38?10:size<50?12:14;
            const cfs=Math.max(8,fs-3);
            const icon=L.divIcon({className:'',html:'<div class="state-bubble" style="width:'+size+'px;height:'+size+'px;background:'+bg+'"><span class="st-abbr" style="font-size:'+fs+'px;color:#2C3E50">'+st+'</span><span class="st-count" style="font-size:'+cfs+'px;color:#2C3E50">'+d.count.toLocaleString()+'</span></div>',iconSize:[size,size],iconAnchor:[size/2,size/2]});

            const scoreStr=avg!=null?avg.toFixed(1):'—';
            m.bindTooltip('<strong>'+si.n+'</strong><br>'+d.count.toLocaleString()+' facilities · avg '+scoreStr,{direction:'top',offset:[0,-size/2-4]});
            stateBubbleLayer.addLayer(m);
        });
        const avgAll=scoredAll>0?(scoreSumAll/scoredAll).toFixed(1):'—';
        setStats(totalAll,avgAll,activeTypeNoun()+' nationwide');
        if(isMobile)renderSheetList();
    }

    async function fetchInView(){

    // ── ENF-VIZ: hospital enforcement banner + survey history ──────────────
    // facility.enforcement_severity is UNGATED here, so it may be a historical
    // (expired) label when has_active_enforcement is false. Label accordingly.
    function buildEnforcementHtml(f,hist){
        const flagged=!!f.has_active_enforcement;
        const sev=normSev(f.enforcement_severity);
        const rows=Array.isArray(hist)?hist:[];
        if(!flagged&&!sev&&!rows.length)return'';
        let banner='';
        if(flagged&&sev){
            const word=sev.charAt(0)+sev.slice(1).toLowerCase();
            banner='<div class="enf-banner sev-'+SEV_WORD[sev]+'"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i><div class="enf-banner-body"><div class="enf-banner-head">Under active enforcement &middot; '+escapeHtml(word)+'</div><div class="enf-banner-sub">CMS has a current, unresolved survey finding on record for this facility. Recent findings are marked <strong>Current</strong> below.</div></div></div>';
        }else if(!flagged&&(sev||rows.length)){
            // expired label or only-historical records: do NOT present as current
            banner='<div class="enf-banner expired"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i><div class="enf-banner-body"><div class="enf-banner-head">No active enforcement</div><div class="enf-banner-sub">'+(sev?'A past finding (severity: '+escapeHtml((sev.charAt(0)+sev.slice(1).toLowerCase()))+') has since expired. ':'')+'Any items below are historical and no longer affect the score.</div></div></div>';
        }
        let histHtml='';
        if(rows.length){
            const sorted=rows.slice().sort((a,b)=>String(b.survey_date||'').localeCompare(String(a.survey_date||'')));
            const SHOW=4;
            const render=r=>{
                const d=r.survey_date?String(r.survey_date).slice(0,10):'';
                const lvlRaw=(r.deficiency_level||r.severity||'').toLowerCase();
                const lvl=LVL_WORD[lvlRaw]||'minor';
                const lvlLabel=lvl==='critical'?'Immediate jeopardy':lvl==='significant'?'Condition-level':'Standard';
                const active=!!r.is_active;
                const tag=r.deficiency_tag?'Tag '+escapeHtml(String(r.deficiency_tag)):'';
                const desc=r.deficiency_description?'<div class="enf-desc">'+escapeHtml(String(r.deficiency_description))+'</div>':'';
                return'<div class="enf-row"><div class="enf-row-top"><span class="enf-date">'+escapeHtml(d)+'</span><span class="enf-level lvl-'+lvl+'">'+lvlLabel+'</span><span class="enf-status '+(active?'current':'resolved')+'">'+(active?'Current':'Resolved')+'</span>'+(tag?'<span class="enf-tag">'+tag+'</span>':'')+'</div>'+desc+'</div>';
            };
            const head=sorted.slice(0,SHOW).map(render).join('');
            const rest=sorted.length>SHOW?sorted.slice(SHOW).map(render).join(''):'';
            histHtml='<h3 class="section-header">Survey findings ('+sorted.length+')</h3><div class="enf-history">'+head+
                (rest?'<div id="enf-rest" hidden>'+rest+'</div><button class="enf-toggle" type="button" data-total="'+sorted.length+'" onclick="toggleEnfHistory(this)">Show all '+sorted.length+' findings</button>':'')+
                '</div><div class="enf-more">Source: CMS survey deficiency records (QCOR). Findings linger on the score after the survey date, then expire.</div>';
        }
        return banner+histHtml;
    }

        const cmsLine=stars?'<span class="cms-stars">CMS overall: '+'<i class="fas fa-star star-icon"></i>'.repeat(Math.round(stars))+' '+stars+'/5</span>':'';
        const enfVizHtml=buildEnforcementHtml(f,hospEnf);
        return'<div class="facility-info"><div class="detail-header-actions"><button class="detail-action-btn" type="button" onclick="copyFacilityLink(\''+escapeHtml(f.facility_id)+'\')" aria-label="Copy link" title="Copy link"><i class="fas fa-link"></i></button><button class="detail-action-btn" type="button" onclick="shareFacility(\''+escapeHtml(f.facility_id)+'\',\''+escapeHtml(f.facility_name)+'\')" aria-label="Share" title="Share"><i class="fas fa-share-nodes"></i></button><button class="detail-action-btn" type="button" data-pin onclick="togglePinPanel()" aria-label="Pin" title="Pin"><i class="fas fa-thumbtack"></i></button><button class="detail-action-btn" type="button" onclick="closeFacilityInfo()" aria-label="Close" title="Close"><i class="fas fa-times"></i></button></div><div class="facility-header"><h2 class="facility-name">'+escapeHtml(f.facility_name||'')+'</h2><div class="facility-type-line">'+escapeHtml(TYPE_LABEL[f.facility_type]||f.facility_type||'')+'</div><div class="score-block"><div class="score-circle '+(cls==='Unrated'?'unrated':'')+'" style="background:'+classColor(cls)+'">'+score+'</div><div class="score-meta"><span class="classification-badge '+classBadgeClass(cls)+'" style="background:'+classColor(cls)+'">'+escapeHtml(cls)+'</span><span class="score-out-of">FTP score · 10-point scale</span>'+cmsLine+'</div></div>'+bHtml+'</div><h3 class="section-header">Component breakdown</h3>'+compHtml+eHtml+enfVizHtml+'<div class="addr-block">'+(f.address?'<div><i class="fas fa-map-marker-alt"></i>'+escapeHtml(f.address||'')+'</div>':'')+'<div style="padding-left:20px">'+escapeHtml(f.city||'')+(f.city?', ':'')+escapeHtml(f.state||'')+' '+escapeHtml(f.zip_code||'')+'</div>'+(f.phone?'<div><i class="fas fa-phone"></i>'+escapeHtml(f.phone)+'</div>':'')+'</div><a href="https://maps.google.com/?q='+f.latitude+','+f.longitude+'" target="_blank" rel="noopener noreferrer" class="directions-btn">Get Directions</a><div class="print-methodology-url">Methodology: ht         const el=document.getElementById('sheet-chips');if(!el)return;el.innerHTML='';
        FACILITY_TYPES.forEach(t=>{
            const c=document.createElement('button');
            c.className='sheet-chip'+(activeTypes.has(t.value)?' on':'');
            c.dataset.type=t.value;c.type='button';c.setAttribute('role','switch');
            c.setAttribute('aria-checked',activeTypes.has(t.value));c.setAttribute('aria-label',t.label);
            c.innerHTML='<i class="fas '+t.icon+'" aria-hidden="true"></i> '+t.label;
            c.addEventListener('click',()=>{if(activeTypes.has(t.value))activeTypes.delete(t.value);else activeTypes.add(t.value);haptic(10);syncChips();onViewChange()});
            el.appendChild(c);
        });
    }
    function wireViewToggle(){
        const t=document.getElementById('view-toggle');if(!t||t._wired)return;t._wired=true;
        t.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
            if(sheetMode==='detail')closeFacilityInfo();
            setSheetSnap(b.dataset.view==='map'?'peek':'half');
            haptic(10);
        }));
    }
    function updateViewToggle(){
        const t=document.getElementById('view-toggle');if(!t)return;
        const mapOn=(sheetSnap==='peek');
        t.querySelectorAll('button').forEach(b=>{const on=(b.dataset.view==='map')===mapOn;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
    }
    // Near me (mobile). Single in-flight request at a time; spinner set on tap and
    // restored on EVERY exit path. Within 4s (Invariant #11) a denial shows the
    // location-off guide. On a 4s TIMEOUT we keep silently watching in the
    // background (so a slow-but-eventually-granted fix still recenters) AND surface
    // an explicit "still trying… / retry" affordance (Q-42: explicit-retry).
    let nearMeBusy=false,nearMeWatchId=null;
    function setNearMeBusy(b,on){
        nearMeBusy=on;
        const i=b.querySelector('i');
        if(on){if(!b._iconPrev)b._iconPrev=i?i.className:'';if(i)i.className='fas fa-spinner fa-spin';b.disabled=true;b.setAttribute('aria-busy','true');}
        else{if(i&&b._iconPrev)i.className=b._iconPrev;b._iconPrev='';b.disabled=false;b.removeAttribute('aria-busy');}
    }
    function clearNearMeWatch(){if(nearMeWatchId!=null&&navigator.geolocation){try{navigator.geolocation.clearWatch(nearMeWatchId)}catch(e){}}nearMeWatchId=null}
    function applyNearMeFix(lat,lng){
        userLocation={lat,lng};
        if(filteredState){filteredState=null;updateStateFilterIndicator()}
        if(map)map.setView([lat,lng],11);
        setSheetSnap('half');
        if(isMobile)renderSheetList();
    }
    function startNearMe(){
        const b=document.getElementById('sheet-nearme');if(!b)return;
        if(nearMeBusy)return;                              // in-flight guard: ignore repeat taps
        haptic(10);
        if(!navigator.geolocation){showSheetGuide('location-off');setSheetSnap('half');return}
        clearNearMeWatch();
        setNearMeBusy(b,true);
        let settled=false;
        const done=fn=>{if(settled)return;settled=true;setNearMeBusy(b,false);if(fn)fn()};
        navigator.geolocation.getCurrentPosition(
            pos=>{clearNearMeWatch();done(()=>applyNearMeFix(pos.coords.latitude,pos.coords.longitude))},
            err=>{
                // code 3 = TIMEOUT: GPS may still resolve. Keep a background watch and
                // offer an explicit retry, while honoring the silent map fallback.
                if(err&&err.code===3){
                    done(()=>{setSheetSnap('half');showNearMePending();
                        if(navigator.geolocation&&nearMeWatchId==null){
                            nearMeWatchId=navigator.geolocation.watchPosition(
                                pos=>{clearNearMeWatch();applyNearMeFix(pos.coords.latitude,pos.coords.longitude)},
                                ()=>{clearNearMeWatch()},
                                {enableHighAccuracy:false,maximumAge:60000});
                        }
                    });
                }else{
                    // denial / position-unavailable: stop, explain, restore.
                    clearNearMeWatch();done(()=>{showSheetGuide('location-off');setSheetSnap('half')});
                }
            },
            {timeout:4000,maximumAge:60000}
        );
    }
    function wireNearMe(){
        const b=document.getElementById('sheet-nearme');if(!b||b._wired)return;b._wired=true;
        b.addEventListener('click',startNearMe);
    }
    function wireSheetSearch(){
        const input=document.getElementById('sheet-search'),results=document.getElementById('sheet-search-results');if(!input||!results)return;
        const run=debounce(async()=>{
            const q=input.value.trim();
            if(q.length<2){results.classList.remove('active');results.innerHTML='';input.setAttribute('aria-expanded','false');return}
            if(!isOnline)return;
            try{const{data,error}=await sb.rpc('search_facilities_by_name',{p_query:q,p_limit:12});if(error)throw error;renderSheetSearchResults(data||[]);input.setAttribute('aria-expanded','true')}catch(e){derr('sheet search failed',e)}
        },250);
        input.addEventListener('input',()=>{if(isMobile&&sheetSnap==='peek')setSheetSnap('half');run()});
        input.addEventListener('focus',()=>{if(isMobile&&sheetSnap==='peek')setSheetSnap('half')});
    }
    function renderSheetSearchResults(rows){
        const el=document.getElementById('sheet-search-results');if(!el)return;
        if(!rows.length){el.innerHTML='<div class="name-result-item"><div class="name-result-meta">No facilities match that name. Check the spelling, or try fewer words.</div></div>';el.classList.add('active');return}
        el.innerHTML=rows.map(r=>{const sc=classColor(r.score_classification),st=r.final_score!=null?r.final_score.toFixed(1):'—';return'<div class="name-result-item" data-id="'+escapeHtml(r.facility_id)+'" data-lat="'+r.latitude+'" data-lng="'+r.longitude+'" role="option"><div class="name-result-name">'+escapeHtml(r.facility_name||'')+'</div><div class="name-result-meta">'+escapeHtml(TYPE_LABEL[r.facility_type]||'')+' · '+escapeHtml(r.city||'')+', '+escapeHtml(r.state||'')+' · <span class="name-result-score" style="background:'+sc+'">'+st+'</span></div></div>'}).join('');
        el.classList.add('active');
        el.querySelectorAll('.name-result-item[data-id]').forEach(it=>it.addEventListener('click',()=>{
            const lat=parseFloat(it.dataset.lat),lng=parseFloat(it.dataset.lng);
            if(!isNaN(lat)&&!isNaN(lng))map.setView([lat,lng],14);
            const inp=document.getElementById('sheet-search');if(inp)inp.value='';
            el.classList.remove('active');el.innerHTML='';
            openFacilityDetail(it.dataset.id);
        }));
    }
    function setStats(count,avg,label){
        const tc=document.getElementById('total-count'),as=document.getElementById('avg-score');
        if(tc)tc.textContent=count.toLocaleString();if(as)as.textContent=avg;
        const ss=document.getElementById('sheet-stats');
        if(ss)ss.innerHTML='<strong>'+count.toLocaleString()+'</strong> '+escapeHtml(label)+' · avg <strong>'+avg+'</strong>/10';
    }
    function renderSheetList(){
        const wrap=document.getElementById('sheet-list');if(!wrap)return;
        if(currentViewMode==='state'){showSheetGuide(filteredState?'state-loading':'start');return}
        const o=originForDistance();
        const rows=currentFacilities.slice();
        if(o)rows.forEach(r=>{r._dist=(r.latitude!=null&&r.longitude!=null)?haversineMiles(o.lat,o.lng,r.latitude,r.longitude):Infinity});
        if(o)rows.sort((a,b)=>(a._dist||Infinity)-(b._dist||Infinity));
        if(!rows.length){showSheetGuide('empty');return}
        const CAP=60,shown=rows.slice(0,CAP);
        let html=shown.map(f=>{
            const cls=f.score_classification||'Unrated',sc=classColor(cls),st=f.final_score!=null?f.final_score.toFixed(1):'—';
            const dist=(o&&f._dist!=null&&isFinite(f._dist))?'<span class="fdist">'+(f._dist<10?f._dist.toFixed(1):Math.round(f._dist))+' mi</span>':'';
            const sev=f.has_active_enforcement?normSev(f.enforcement_severity):null;
            const flag=f.has_active_enforcement?'<span class="sheet-flag'+(sev?' sev-'+SEV_WORD[sev]:'')+'" aria-label="Under active enforcement'+(sev?', '+SEV_WORD[sev]:'')+'">FLAGGED</span>':'';
            return'<button class="sheet-frow" type="button" data-id="'+escapeHtml(f.facility_id)+'"><span class="sc '+(cls==='Unrated'?'unrated':'')+'" style="background:'+sc+'">'+st+'</span><span class="fmeta"><span class="fnm">'+escapeHtml(f.facility_name||'')+'</span><span class="fsub">'+escapeHtml(TYPE_LABEL[f.facility_type]||'')+' · '+escapeHtml(cls)+'</span></span>'+flag+dist+'</button>';
        }).join('');
        if(rows.length>CAP)html+='<div class="sheet-guide" style="padding:14px 10px"><p>Showing the nearest '+CAP+' of '+rows.length.toLocaleString()+'. Zoom in or search to narrow it down.</p></div>';
        html+='<div class="sheet-legend">Scores run 1&ndash;10. <span class="lg-dot" style="background:var(--cls-excep)"></span><span class="lg-dot" style="background:var(--cls-average)"></span><span class="lg-dot" style="background:var(--cls-poor)"></span> Green is stronger, red is weaker, gray means not enough public data to rate.</div>';
        html+=sheetLinksHtml();
        wrap.innerHTML=html;
        wrap.querySelectorAll('.sheet-frow[data-id]').forEach(it=>it.addEventListener('click',()=>{
            const f=currentFacilities.find(x=>String(x.facility_id)===it.dataset.id);
            if(f&&f.latitude!=null&&f.longitude!=null)map.setView([f.latitude,f.longitude],Math.max(map.getZoom(),13));
            openFacilityDetail(it.dataset.id);
        }));
    }
    function showSheetGuide(kind){
        const wrap=document.getElementById('sheet-list');if(!wrap)return;
        let icon='fa-magnifying-glass-location',h='Find a facility',p='Search by name above, tap Near me, or tap a state on the map to zoom in.';
        if(kind==='empty'){icon='fa-map-location-dot';h='No facilities here yet';p='Zoom out, move the map, or search by name.';}
        else if(kind==='location-off'){icon='fa-location-crosshairs';h='Location is off';p='No problem — search by name above, or pan the map to your area.';}
        else if(kind==='state-loading'){icon='fa-spinner fa-spin';h='Loading facilities…';p='One moment.';}
        else if(kind==='no-types'){icon='fa-filter';h='No types selected';p='Pick at least one facility type above to see results.';}
        wrap.innerHTML='<div class="sheet-guide"><i class="fas '+icon+'" aria-hidden="true"></i><h4>'+h+'</h4><p>'+p+'</p></div>'+sheetLinksHtml();
    }
    // Slow-GPS state: the 4s timeout fired but we're still listening in the
    // background. Show progress + an explicit Retry (Q-42 explicit-retry).
    function showNearMePending(){
        const wrap=document.getElementById('sheet-list');if(!wrap)return;
        wrap.innerHTML='<div class="sheet-guide"><i class="fas fa-location-crosshairs fa-fade" aria-hidden="true"></i><h4>Still finding your location…</h4><p>This can take a moment. We&rsquo;ll center the map automatically once your device responds — or you can search by name above.</p><button class="clear-btn" type="button" id="nearme-retry" style="margin-top:6px">Try again</button></div>'+sheetLinksHtml();
        const r=document.getElementById('nearme-retry');if(r)r.addEventListener('click',()=>{clearNearMeWatch();startNearMe()});
    }
    function sheetLinksHtml(){return'<div class="sheet-links"><a href="/about">About</a><a href="/methodology">Methodology</a><a href="/medical-disclaimer">Disclaimer</a><a href="/dispute-process">Dispute</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>'}
    function setSheetContent(mode){
        sheetMode=mode;
        const home=document.getElementById('sheet-home'),detail=document.getElementById('sheet-detail');
        if(!home||!detail)return;
        if(mode==='detail'){home.hidden=true;detail.hidden=false}else{detail.hidden=true;home.hidden=false}
    }

    // ─── Bottom sheet (mobile only) ──────────────────────────────────────────
    function getSnapHeights(){
        const vh=window.innerHeight;
        let peek=170;
        const handle=document.getElementById('detail-sheet-handle'),rail=document.querySelector('.sheet-rail');
        if(rail){const rh=rail.offsetHeight,hh=handle?handle.offsetHeight:18;if(rh>0)peek=hh+rh+6}
        const full=Math.round(vh*0.9);
        peek=Math.min(peek,Math.round(vh*0.45));
        let half=Math.max(Math.round(vh*0.5),peek+72);half=Math.min(half,full);
        return{closed:0,peek,half,full};
    }
    function applySheetHeight(h,animate){const sheet=document.getElementById('detail-sheet');if(!sheet)return;sheet.style.transition=animate?'height .3s cubic-bezier(.25,.1,.25,1)':'none';sheet.style.height=Math.max(0,h)+'px'}
    function setSheetSnap(snap,animate){
        if(!isMobile)return;
        const sheet=document.getElementById('detail-sheet');if(!sheet)return;
        let key=snap;
        if(sheetMode==='detail'&&key==='peek')key='half';   // detail never rests at peek
        const heights=getSnapHeights();
        const h=heights[key]!=null?heights[key]:heights.half;
        sheetSnap=key;
        sheet.setAttribute('aria-hidden','false');
        applySheetHeight(h,animate!==false);
        updateViewToggle();
    }
    // Back-compat shims for older call sites.
    function openBottomSheet(snap){setSheetSnap(snap==='full'?'full':'half')}
    function closeBottomSheet(){setSheetContent('home');setSheetSnap('peek')}
    function setupBottomSheetHandle(){
        const sheet=document.getElementById('detail-sheet');
        const oldHandle=document.getElementById('detail-sheet-handle');
        if(!sheet||!oldHandle)return;
        const handle=oldHandle.cloneNode(false);              // drop stale listeners
        oldHandle.parentNode.replaceChild(handle,oldHandle);
        let sY,sH,drag=false;
        handle.addEventListener('touchstart',e=>{drag=true;sY=e.touches[0].clientY;sH=sheet.offsetHeight;sheet.style.transition='none'},{passive:true});
        handle.addEventListener('touchmove',e=>{if(!drag)return;const heights=getSnapHeights();const newH=Math.min(heights.full,Math.max(0,sH+(sY-e.touches[0].clientY)));applySheetHeight(newH,false)},{passive:true});
        handle.addEventListener('touchend',()=>{
            if(!drag)return;drag=false;
            const heights=getSnapHeights(),h=sheet.offsetHeight;
            const cands=sheetMode==='detail'
                ?[['back',heights.peek],['half',heights.half],['full',heights.full]]
                :[['peek',heights.peek],['half',heights.half],['full',heights.full]];
            cands.sort((a,b)=>Math.abs(h-a[1])-Math.abs(h-b[1]));
            const best=cands[0][0];
            if(sheetMode==='detail'&&best==='back')closeFacilityInfo();   // drag down in detail = back to list
            else setSheetSnap(best);
            haptic(10);
        },{passive:true});
    }

    function handleViewportResize(){
        checkMobile();
        if(isMobile){
            setupBottomSheetHandle();
            setSheetContent(sheetMode);
            setSheetSnap(sheetSnap==='closed'?'peek':sheetSnap,false);
        }else{
            const sheet=document.getElementById('detail-sheet');if(sheet)sheet.style.height='';
        }
        if(map)map.invalidateSize();
    }

    function setupOfflineDetection(){const t=document.getElementById('offline-toast');window.addEventListener('offline',()=>{isOnline=false;t.classList.add('active')});window.addEventListener('online',()=>{isOnline=true;t.classList.remove('active');onViewChange()})}
    function setupKeyboardShortcuts(){document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.target.closest('input,select,textarea')){e.preventDefault();document.getElementById('name-search')?.focus()}if(e.key==='Escape'&&openFacilityId)closeFacilityInfo()})}

    window.addEventListener('load',()=>{
        checkMobile();
        const debouncedResize=debounce(handleViewportResize,150);
        window.addEventListener('resize',debouncedResize);
        window.addEventListener('orientationchange',()=>{setTimeout(handleViewportResize,250)});
        const u=getUrlState();
        const saved=u.theme||(function(){try{return localStorage.getItem('theme')}catch(e){return null}})()||'light';
        currentTheme=saved;
        document.documentElement.setAttribute('data-theme',currentTheme);
        if(currentTheme==='dark'){
            const b=document.getElementById('theme-toggle-btn');
            b.classList.add('active');b.setAttribute('aria-checked','true');
            b.querySelector('.toggle-slider i').className='fas fa-moon';
            document.querySelector('meta[name="theme-color"]').content='#1A1F36';
        }
        initMap();
        setupOfflineDetection();
        setupKeyboardShortcuts();
        if(isMobile){setupBottomSheetHandle();setSheetContent('home');renderSheetList();requestAnimationFrame(()=>setSheetSnap('peek',false))}
    });
    </script>
