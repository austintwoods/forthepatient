<!--

  facility-type selector, WITHOUT removing the required attribution (Known
  Issues #24 / Decision 152). Pairs with app.js v1.6. Pure frontend; NO backend
  change; NO new colors (#18); DESKTOP (>768px) layout byte-for-byte unchanged
  (Invariant #29 — the change is confined to the app.js map-init and a
  mobile-only @media(max-width:768px) CSS block).
  Changelog vs v5.9:
    ATTRIB-FIX: (1) app.js v1.6 drops only the non-required "Leaflet" prefix
          link (attributionControl:false + L.control.attribution({prefix:false})).
          (2) Here, a mobile-only rule lifts the bottom-right Leaflet control
          above the fixed sheet bar (List/Map toggle + chips) by --sheet-bar-h
          (112px) + safe-area, and makes .leaflet-control-attribution translucent
          + pointer-events:none so it never blocks a chip tap. The CARTO + CMS
          attribution itself is KEPT and visible — it is contractually required
          (CARTO basemap terms + the OpenStreetMap data beneath them) and part of
          FTP's honest-sourcing brand. Deleting it to free UI space was explicitly
          rejected (Decision 152). Desktop bottom-right attribution is unchanged.
  ----------------------------------------------------------------------------
  ForThePatient.org v5.9 (Session B-FLAG-SCOPE — June 21 2026)
  Minimal DETAIL-CARD-ONLY frontend change for the demoted payment-penalty
  signal (S-20 / Q-58 / Decision 148). Pairs with app.js v1.5. No backend RPC
  signature change (the new facilities columns ride into facility_detail via the
  existing to_jsonb(f.*)); NO map/marker change; DESKTOP (>768px) layout
  byte-for-byte unchanged (Invariant #29); NO new colors (Invariant #18).
  Changelog vs v5.8:
    B-FLAG-SCOPE (CSS here; logic in app.js v1.5): the enforcement flag (the red
          FLAGGED marker + severity ring + "Under active enforcement" banner) now
          reflects active SURVEY enforcement ONLY. Routine Medicare payment
          penalties (HRRP readmissions / HAC) — which hit ~75-80% of hospitals a
          year and were firing the red flag on 45.5% of all hospitals — are
          DEMOTED to a separate, NEUTRAL "Medicare payment penalties" line on the
          detail card (new .payment-penalty-block, built from neutral tokens
          only). The map marker path is untouched: a payment-only hospital simply
          no longer renders a red ring (it isn't has_active_enforcement). The new
          facility fields has_payment_penalty + payment_penalty_detail arrive on
          the 'facility' object with no RPC change. This is what makes the flag
          mean something serious again (the S-20 dilution fix).
  ----------------------------------------------------------------------------
  ForThePatient.org v5.8 (Session GEO-DOT — June 2026)
  MOBILE-FORWARD frontend change (the geo dot also helps desktop, but the intent
  is the mobile first-open experience). Pairs with app.js v1.4. No backend, RPC,
  schema, or scoring change. DESKTOP (>768px) layout byte-for-byte unchanged
  (Invariant #29): the only additions are a new map-marker style + its keyframes.
  Changelog vs v5.7:
    GEO-DOT (CSS here; logic in app.js v1.4): a slightly larger PULSING BLUE
          "you are here" dot (.ftp-geo-dot) marks the visitor's exact geolocation
          on the map so proximity to nearby facilities is readable at a glance.
          Blue (#2D7DF6) is a deliberate NON-facility UI color — never a score,
          classification, or enforcement signal (the documented Invariant #18
          carve-out, same basis as the enforcement reds) — so it can't be mistaken
          for a facility rating. White halo for legibility on any basemap; an
          expanding pulse ring (respects prefers-reduced-motion → static dot).
          Rendered in its own userLocationLayer, above the facility markers.
    GEO-DEFAULT (logic in app.js v1.4): the DEFAULT mobile view on first open is
          now the MAP (not the List). On geolocation success the user lands on the
          map centered on their metro with the blue dot, and can toggle to List
          with one tap. The List itself is unchanged — only the default view that
          appears first changed. (sheetView already defaulted to 'map'; v1.4 simply
          stops forcing 'list' in the geolocation success callback.)
-->
<!--
  ForThePatient.org v5.7 (Session MOBILE-CLOSE-FIX — June 2026)
  MOBILE-ONLY one-line hotfix. Pure CSS; no JS, markup, backend, RPC, schema,
  or scoring change. DESKTOP (>768px) byte-for-byte unchanged (Invariant #29).
  Changelog vs v5.6:
    MCF-1: The mobile facility-detail overlay height was
          calc(100dvh - var(--safe-top) - 8px), i.e. it did NOT subtract the
          fixed header's height the way the LIST view already does. Because the
          sheet is position:fixed;bottom:0, that extra header's-worth of height
          pushed the overlay's TOP edge (and the sticky .sheet-detail-bar that
          carries Back + Close) up UNDER the fixed header (z-index 1000 vs the
          sheet's 800), so the Close button was obscured and untappable — users
          got stuck on a card and had to reload (founder report). Fix: subtract
          var(--header-h) too, matching the list-view rule, so the overlay's top
          (and the Close button) sits flush BELOW the header and stays reachable
          in portrait and landscape. Reinforces Invariant #34 (the detail card
          must always be exitable). One selector changed; nothing else touched.
-->
<!--

  Pure frontend; consumes the live B-ENF-FLAG contract read-only — NO backend/

<!--
  ForThePatient.org v5.3 (Session ENF-VIZ-2 — June 2026)
  Enforcement filter + state drill-down dots + collapsed survey findings.
  Pure frontend; no backend/scoring/schema changes. Consumes the live B-ENF-FLAG
  contract read-only.
  Changelog vs v5.2:
    EV2-1: "RECENT CMS ENFORCEMENT" FILTER. A toggle in the desktop filter bar
          (a warning-tinted chip, distinct from the facility-type chips) and a
          matching full-width switch at the top of the mobile home sheet. When on,
          only facilities with has_active_enforcement are shown on the map, in the
          mobile list, and in the in-view stats. It is a CLIENT-SIDE view filter
          over the rows already fetched (visibleFacilities()) — it re-renders in
          place and does NOT issue a new RPC. Dedicated empty states ("No flagged
          facilities in view") on both surfaces. State var enforcementOnly (was
          declared-but-unused) now drives it; reset by Clear Filters.
    EV2-2: STATE DRILL-DOWN = INDIVIDUAL DOTS. When a state is selected from the
          national zoomed-out view (filteredState set), every facility is rendered

        /* ── MOBILE-CLEAN-1 (v5.6): static control bar, no draggable snaps ──────
           The mobile bottom surface has three discrete, CSS-driven states set via
           a data-view / data-mode attribute on #detail-sheet — never a JS-measured

        .bottom-sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--card-bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);max-height:100dvh;overflow:hidden;flex-direction:column;box-sizing:border-box;transition:height .28s cubic-bezier(.25,.1,.25,1)}
        .sheet-close-btn{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--hover-bg);border:none;color:var(--text-primary);font-size:1.05rem;cursor:pointer;border-radius:10px;font-family:inherit;padding:0;flex-shrink:0}

        ::-webkit-scrollbar{width:6px;height:6px}

        @media(max-width:768px){

            .state-filter-badge{font-size:.66rem;padding:4px 6px 4px 8px;min-height:28px}
            .footer-bar{bottom:calc(10px + var(--safe-bottom));padding:5px 12px;font-size:.64rem;gap:10px;left:calc(50%);right:auto;max-width:calc(100% - 16px)}
            .facility-info{padding:18px;padding-top:14px;padding-left:max(16px,calc(16px + var(--safe-left)));padding-right:max(16px,calc(16px + var(--safe-right)))}
            .facility-name{font-size:1.05rem}

        }
        /* ── MOBILE-CLEAN-1 (v5.6): static control bar + list overlay ─────────
           Replaces the v5.0–v5.5 draggable "home sheet" (peek/half/full) with a
           clean, non-draggable two-state surface. The bottom-sheet height is driven
           entirely by [data-view] on #detail-sheet (set in JS), with CSS doing the

        .sheet-home{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

           obscures the map in MAP view. This is the ONLY persistent mobile chrome. */
        .sheet-bar{flex-shrink:0;padding:10px 14px 10px;padding-left:max(14px,calc(14px + var(--safe-left)));padding-right:max(14px,calc(14px + var(--safe-right)));border-bottom:1px solid transparent;background:var(--card-bg)}

        .sheet-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
        .sheet-chip i{font-size:.72rem}

           fill the sheet in LIST view. */
        .sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 14px calc(18px + var(--safe-bottom));padding-left:max(14px,calc(14px + var(--safe-left)));padding-right:max(14px,calc(14px + var(--safe-right)))}
        .sheet-statsrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}

        .sheet-detail-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;padding-left:max(12px,calc(12px + var(--safe-left)));padding-right:max(12px,calc(12px + var(--safe-right)));border-bottom:1px solid var(--border);background:var(--card-bg)}

        .sheet-back-btn:hover,.sheet-back-btn:focus-visible{background:var(--hover-bg);color:var(--text-primary)}

        .sheet-guide h4{font-size:.92rem;font-weight:700;color:var(--text-secondary);margin-bottom:5px}
        .sheet-guide p{font-size:.8rem;line-height:1.5;max-width:34ch;margin:0 auto}
        .sheet-legend{font-size:.7rem;color:var(--text-secondary);line-height:1.55;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
        .sheet-legend .lg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1px;vertical-align:middle}
        .sheet-links{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
        .sheet-links a{font-size:.74rem;color:var(--text-secondary);text-decoration:none}
        .sheet-links a:hover{color:var(--accent)}
        .sheet-detail{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
        /* ── MOBILE-CLEAN-1 (v5.6): the three discrete sheet states ────────────
           Heights are CSS-driven off [data-view] / [data-mode] on #detail-sheet.
           MAP: the sheet is exactly the static bar (toggle + chips); the scroll
                region is collapsed so the list can never peek through (request #4).
           LIST: the sheet covers most of the map; the bar stays pinned, the list
                 scrolls underneath it.
           DETAIL: a full overlay with the sticky Close header. */
        .bottom-sheet[data-mode="home"][data-view="map"]{height:auto}
        .bottom-sheet[data-mode="home"][data-view="map"] .sheet-scroll{flex:0 0 0;height:0;padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none}
        .bottom-sheet[data-mode="home"][data-view="map"] .sheet-bar{border-bottom-color:transparent}
        .bottom-sheet[data-mode="home"][data-view="list"]{height:calc(100dvh - var(--header-h) - var(--safe-top) - 8px)}
        .bottom-sheet[data-mode="home"][data-view="list"] .sheet-bar{border-bottom-color:var(--border)}
        .bottom-sheet[data-mode="detail"]{height:calc(100dvh - var(--header-h) - var(--safe-top) - 8px)}
        .bottom-sheet[data-mode="detail"] .sheet-home{display:none}
        .bottom-sheet[data-mode="home"] .sheet-detail{display:none}
        /* ── ENF-VIZ: enforcement markers + survey history ─────────────────── */
        /* Marker ring: severity styles the RING (is something wrong here),
           the dot fill keeps the score-classification color (the quality score).
           Colors are the documented classification palette — no new colors. */
        .ftp-flag{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%}
        .ftp-flag .ftp-dot{position:relative;z-index:2}
        .ftp-flag .enf-ring{position:absolute;inset:0;border-radius:50%;z-index:1}
        /* CAP-VIZ (C1-RING): graduated RED severity scale. MINOR → CRITICAL reads
           light-red → deep-red, so a patient can tell a minor finding from a
           critical one at a glance without opening the card. */
        .enf-ring.sev-critical{box-shadow:0 0 0 3px #B71C1C,0 0 8px 2px rgba(183,28,28,.85)}
        .enf-ring.sev-severe{box-shadow:0 0 0 3px #E53935,0 0 6px 1px rgba(229,57,53,.7)}
        .enf-ring.sev-moderate{box-shadow:0 0 0 2px #EF5350,0 0 4px 1px rgba(239,83,80,.55)}
        .enf-ring.sev-minor{box-shadow:0 0 0 2px #EF9A9A}
        @media(prefers-reduced-motion:no-preference){
            .enf-ring.sev-critical{animation:enfPulse 2s ease-in-out infinite}
        }
        @keyframes enfPulse{0%,100%{box-shadow:0 0 0 3px #B71C1C,0 0 6px 1px rgba(183,28,28,.6)}50%{box-shadow:0 0 0 3px #B71C1C,0 0 10px 3px rgba(183,28,28,.95)}}
        /* ── GEO-DOT (v5.8): the visitor's own "you are here" location marker ──
           A slightly larger PULSING BLUE dot (distinct from rating/score dots and
           from the red enforcement rings) marking the user's exact position so
           proximity to nearby facilities is readable at a glance. Blue (#2D7DF6)
           is a deliberate non-facility UI color (the documented carve-out, like
           the enforcement reds): it is never used for a score, classification, or
           enforcement signal, so it can't be confused with a facility's rating.
           A white halo keeps it legible on both light and dark basemaps; an
           expanding pulse ring draws the eye. Reduced-motion users get a static
           dot (no pulse). Non-interactive: it's a position marker, not a tap target. */
        .ftp-geo-dot{position:relative;width:26px;height:26px;display:flex;align-items:center;justify-content:center;pointer-events:none}
        .ftp-geo-dot .ftp-geo-core{position:relative;z-index:2;width:16px;height:16px;border-radius:50%;background:#2D7DF6;border:3px solid #fff;box-shadow:0 0 0 1px rgba(45,125,246,.55),0 1px 4px rgba(0,0,0,.35)}
        .ftp-geo-dot .ftp-geo-pulse{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;background:rgba(45,125,246,.45);transform:translate(-50%,-50%);z-index:1}
        [data-theme="dark"] .ftp-geo-dot .ftp-geo-core{border-color:#1A1F36}
        @media(prefers-reduced-motion:no-preference){
            .ftp-geo-dot .ftp-geo-pulse{animation:geoPulse 2.2s ease-out infinite}
        }
        @keyframes geoPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}70%{transform:translate(-50%,-50%) scale(3.2);opacity:0}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
        /* Detail card: enforcement banner + per-survey history */
        .enf-banner{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.82rem;border:1px solid}
        .enf-banner i{margin-top:1px;font-size:.95rem;flex-shrink:0}
        .enf-banner .enf-banner-body{min-width:0}
        .enf-banner .enf-banner-head{font-weight:700;color:var(--text-primary);margin-bottom:2px}
        .enf-banner .enf-banner-sub{color:var(--text-secondary);font-size:.74rem;line-height:1.45}
        .enf-banner.sev-critical{background:rgba(183,28,28,.12);border-color:rgba(183,28,28,.5);border-left:4px solid #B71C1C}
        .enf-banner.sev-critical i{color:#B71C1C}
        .enf-banner.sev-severe{background:rgba(229,57,53,.1);border-color:rgba(229,57,53,.45);border-left:4px solid #E53935}
        .enf-banner.sev-severe i{color:#E53935}
        .enf-banner.sev-moderate{background:rgba(239,83,80,.08);border-color:rgba(239,83,80,.4);border-left:4px solid #EF5350}
        .enf-banner.sev-moderate i{color:#EF5350}
        .enf-banner.sev-minor{background:rgba(239,154,154,.12);border-color:rgba(239,154,154,.5);border-left:4px solid #EF9A9A}
        .enf-banner.sev-minor i{color:#C62828}
        .enf-banner.expired{background:var(--hover-bg);border-color:var(--border)}
        .enf-banner.expired i{color:var(--text-secondary)}
        /* B-FLAG-SCOPE: the DEMOTED payment-penalty signal. Deliberately NEUTRAL
           (no enforcement red, no new colors — Invariant #18): it must read as
           "informational", clearly distinct from the red active-enforcement
           banner above it. Uses only the existing neutral tokens. */
        .payment-penalty-block{margin-top:14px;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--hover-bg);font-size:.82rem}
        .payment-penalty-head{font-weight:700;color:var(--text-primary);margin-bottom:3px;display:flex;align-items:center;gap:8px}
        .payment-penalty-head i{color:var(--text-secondary);font-size:.9rem;flex-shrink:0}
        .payment-penalty-sub{color:var(--text-secondary);font-size:.74rem;line-height:1.45}
        .enf-history{margin-top:6px}
        .enf-row{padding:9px 0;border-bottom:1px solid var(--border);font-size:.78rem}
        .enf-row:last-child{border-bottom:none}
        .enf-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .enf-date{font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums}
        .enf-tag{color:var(--text-secondary);font-size:.72rem}
        .enf-level{font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;color:#2C3E50;white-space:nowrap}
        .enf-level.lvl-critical{background:#E8A0A0}
        .enf-level.lvl-significant{background:#F0B8A0}
        .enf-level.lvl-minor{background:#F8D08A}
        .enf-status{font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap}
        .enf-status.current{background:var(--cls-poor);color:#fff}
        .enf-status.resolved{background:var(--border);color:var(--text-secondary)}
        .enf-desc{color:var(--text-secondary);margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
        .enf-more{font-size:.72rem;color:var(--text-secondary);margin-top:8px}
        .enf-toggle{background:none;border:none;color:var(--accent);font-family:inherit;font-size:.74rem;font-weight:600;cursor:pointer;padding:8px 0 0;min-height:32px}
        /* Mobile FLAGGED pill upgraded to severity-aware (Decision 127) */
        .sheet-flag.sev-critical{background:#B71C1C;color:#fff}
        .sheet-flag.sev-severe{background:#E53935;color:#fff}
        .sheet-flag.sev-moderate{background:#EF5350;color:#fff}
        .sheet-flag.sev-minor{background:#EF9A9A;color:#7B1212}
        /* ── ENF-FILTER: "Recent CMS Enforcement" toggle (desktop filter bar) ──
           Styled as a warning filter, NOT a facility-type chip: it carries the
           enforcement-critical tint when active so it reads as "show only the
           flagged" rather than "another category." */
        .enf-filter-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:16px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--card-bg);color:var(--text-secondary);transition:all .15s;user-select:none;white-space:nowrap;min-height:32px;flex-shrink:0;font-family:inherit}
        .enf-filter-chip i{font-size:.7rem;color:#C0392B;transition:color .15s}
        .enf-filter-chip:hover{background:rgba(232,160,160,.14);color:var(--text-primary);border-color:rgba(232,160,160,.6)}
        .enf-filter-chip[aria-pressed="true"]{background:#C0392B;color:#fff;border-color:#C0392B}
        .enf-filter-chip[aria-pressed="true"] i{color:#fff}
        .enf-filter-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        /* ── ENF-FILTER (mobile): removed in MOBILE-CLEAN-1 (v5.6) — the in-sheet
           enforcement toggle markup was dropped from the mobile surface. The
           desktop filter-bar enforcement chip (.enf-filter-chip) is UNCHANGED. ── */
        /* ── STATE DOTS: individual facility dots when a state is drilled into ──
           Larger, brighter, bordered dots replace the color-coded clusters so the
           whole state reads as discrete rated facilities, not pies. */
        .ftp-statedot{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 5px rgba(0,0,0,.3);filter:saturate(1.25)}
        [data-theme="dark"] .ftp-statedot{border-color:rgba(255,255,255,.92)}
        .ftp-flag.statedot-flag .ftp-dot{border:2px solid #fff}
        [data-theme="dark"] .ftp-flag.statedot-flag .ftp-dot{border-color:rgba(255,255,255,.92)}
        /* ── Survey findings: collapsed-by-default disclosure ── */
        .enf-disclosure{margin-top:6px}
        .enf-disc-btn{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-bg);color:var(--text-primary);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-align:left;min-height:44px;transition:background .15s,border-color .15s}
        .enf-disc-btn:hover{background:var(--hover-bg);border-color:var(--accent)}
        .enf-disc-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .enf-disc-btn .ed-ic{flex-shrink:0;color:var(--text-secondary);font-size:.8rem;transition:transform .2s}
        .enf-disc-btn[aria-expanded="true"] .ed-ic{transform:rotate(90deg)}
        .enf-disc-btn .ed-label{flex:1;min-width:0}
        .enf-disc-btn .ed-caret{flex-shrink:0;color:var(--text-secondary);font-size:.7rem}
        .enf-disc-panel[hidden]{display:none}
        .enf-disc-panel{margin-top:4px}
        /* ── TRANSLATE-1: plain-language patient summary ───────────────────────
           A calm reading of the data, placed first in the card body (persona-1
           wins). The left accent bar shifts with the overall tone; every color is
           from the documented classification palette / accent — no new colors
           (Invariant #18). Distinct from the alarm-toned .enf-banner. */
        .patient-summary{margin:16px 0 4px;padding:14px 16px 12px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;background:var(--hover-bg)}
        .patient-summary .ps-eyebrow{display:flex;align-items:center;gap:7px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:8px}
        .patient-summary .ps-eyebrow i{font-size:.78rem;color:var(--accent)}
        .patient-summary .ps-line{font-size:.92rem;line-height:1.5;color:var(--text-primary);margin:0 0 8px}
        .patient-summary .ps-line:last-of-type{margin-bottom:6px}
        .patient-summary .ps-foot{font-size:.7rem;color:var(--text-secondary);line-height:1.45;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
        .patient-summary .ps-foot a{color:var(--accent);text-decoration:none}
        .patient-summary .ps-foot a:hover{text-decoration:underline}
        /* tone bar + eyebrow icon by overall reading */
        .patient-summary.tone-good{border-left-color:#5FA85F}
        .patient-summary.tone-good .ps-eyebrow i{color:#5FA85F}
        .patient-summary.tone-mid{border-left-color:var(--accent)}
        .patient-summary.tone-low{border-left-color:#C0392B}
        .patient-summary.tone-low .ps-eyebrow i{color:#C0392B}
        .patient-summary.tone-flag{border-left-color:#C0392B;background:rgba(232,160,160,.12)}
        .patient-summary.tone-flag .ps-eyebrow i{color:#C0392B}
        [data-theme="dark"] .patient-summary.tone-good{border-left-color:#A0D8A0}
        [data-theme="dark"] .patient-summary.tone-good .ps-eyebrow i{color:#A0D8A0}
        .section-note{font-size:.74rem;color:var(--text-secondary);line-height:1.45;margin:-4px 0 10px}
        /* ── CAP-VIZ (C2-CAP): capabilities filter — desktop trigger + dropdown ── */
        .cap-filter{position:relative;flex-shrink:0}
        .cap-filter-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:16px;font-size:.72rem;font-weight:600;cursor:pointer;background:var(--card-bg);color:var(--text-secondary);transition:all .15s;white-space:nowrap;min-height:32px;font-family:inherit}
        .cap-filter-btn i{font-size:.7rem}
        .cap-filter-btn .cap-caret{font-size:.6rem;opacity:.7;transition:transform .2s}
        .cap-filter-btn[aria-expanded="true"] .cap-caret{transform:rotate(180deg)}
        .cap-filter-btn:hover{background:var(--hover-bg);color:var(--text-primary)}
        .cap-filter-btn.has-active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .cap-filter-btn.has-active i{color:#fff}
        .cap-filter-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .cap-count{display:none;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#fff;color:var(--accent);font-size:.62rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
        .cap-filter-btn:not(.has-active) .cap-count{background:var(--accent);color:#fff}
        .cap-menu{position:absolute;top:calc(100% + 8px);left:0;width:300px;max-width:calc(100vw - 32px);background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);z-index:650;display:none;overflow:hidden}
        .cap-menu.open{display:block}
        .cap-menu-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
        .cap-clear{background:none;border:none;color:var(--accent);font-family:inherit;font-size:.7rem;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px;text-transform:none;letter-spacing:0}
        .cap-clear:hover{background:var(--hover-bg)}
        .cap-menu-list{max-height:min(60vh,360px);overflow-y:auto;padding:6px}
        .cap-menu-foot{padding:9px 14px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text-secondary);line-height:1.4}
        .cap-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text-primary);transition:background .12s}
        .cap-opt:hover{background:var(--hover-bg)}
        .cap-opt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
        .cap-opt .cap-ic{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--hover-bg);color:var(--accent);font-size:.82rem}
        .cap-opt .cap-text{flex:1;min-width:0;line-height:1.25}
        .cap-opt .cap-label{display:block;font-size:.82rem;font-weight:600}
        .cap-opt .cap-hint{display:block;font-size:.68rem;color:var(--text-secondary)}
        .cap-opt .cap-check{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.6rem;transition:all .12s}
        .cap-opt .cap-check i{opacity:0}
        .cap-opt.on .cap-ic{background:var(--accent);color:#fff}
        .cap-opt.on .cap-check{background:var(--accent);border-color:var(--accent)}
        .cap-opt.on .cap-check i{opacity:1}
        /* ── CAP-VIZ (C5-LEGEND): map rating legend (desktop), top-left under bar ── */
        .map-legend{position:absolute;top:64px;left:12px;z-index:440;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:10px;padding:9px 12px;box-shadow:0 2px 12px rgba(0,0,0,.06);font-size:.68rem;color:var(--text-secondary);max-width:210px}
        [data-theme="dark"] .map-legend{background:rgba(44,62,80,.92)}
        .map-legend .lg-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:6px}
        .map-legend .lg-rows{display:flex;flex-direction:column;gap:3px}
        .map-legend .lg-row{display:flex;align-items:center;gap:7px;color:var(--text-primary);font-size:.7rem;line-height:1.3}
        .map-legend .lg-swatch{flex-shrink:0;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
        .map-legend .lg-enf{display:flex;align-items:flex-start;gap:7px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.35;font-size:.66rem}
        .map-legend .lg-ring{flex-shrink:0;width:11px;height:11px;margin-top:1px;border-radius:50%;background:var(--cls-average);box-shadow:0 0 0 2px #B71C1C}
        /* (MOBILE-CLEAN-1 v5.6: the mobile in-sheet capabilities panel and the
           in-sheet enforcement toggle were removed from the mobile surface to
           declutter it; their CSS is dropped here. The desktop filter-bar
           Capabilities dropdown and enforcement chip are UNCHANGED.) */
        .print-methodology-url{display:none}
    </style>
</head>

                <a class="nav-btn active" href="/" aria-label="Map" aria-current="page">Map</a>

    <main class="main" id="map-page" role="main">

            <div class="search-compact"><i class="fas fa-search search-icon" aria-hidden="true"></i><input type="text" id="name-search" placeholder="Search facility…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="name-results" aria-autocomplete="list" aria-label="Search facility by name"><div class="name-results" id="name-results" role="listbox"></div></div>
            <div class="filter-divider" aria-hidden="true"></div>
            <button class="state-filter-badge" id="state-filter-badge" type="button" hidden aria-label="Clear state filter"><span id="state-filter-name"></span><i class="fas fa-times state-filter-x" aria-hidden="true"></i></button>
            <button class="enf-filter-chip" id="enf-filter-chip" type="button" aria-pressed="false" aria-label="Show only facilities under recent CMS enforcement" title="Show only facilities under recent CMS enforcement"><i class="fas fa-gavel" aria-hidden="true"></i> Recent CMS enforcement</button>
            <div class="cap-filter">
                <button class="cap-filter-btn" id="cap-filter-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="cap-menu" aria-label="Filter by capabilities" title="Filter by capabilities (NICU, ER, cardiac cath, MRI, and more)"><i class="fas fa-list-check" aria-hidden="true"></i> Capabilities<span class="cap-count" aria-hidden="true"></span><i class="fas fa-chevron-down cap-caret" aria-hidden="true"></i></button>
                <div class="cap-menu" id="cap-menu" role="dialog" aria-label="Required capabilities"></div>
            </div>
            <div class="chip-scroll-wrap"><div class="chip-scroll" id="chip-scroll" role="group" aria-label="Filters"></div></div>
            <div class="stats-inline" aria-live="polite"><span class="stat-item"><strong id="total-count">0</strong><span class="stats-label">&nbsp;in view</span></span><span class="stat-item"><span class="stats-label">avg&nbsp;</span><strong id="avg-score">—</strong></span></div>
        </div>
        <div class="map-legend" id="map-legend" aria-label="Map rating legend"></div>
        <aside class="info-panel" id="info-panel" role="dialog" aria-modal="false" aria-label="Facility details"><div class="resize-handle" id="resize-handle" aria-hidden="true"></div><div id="facility-info-content"><div class="empty-state"><i class="fas fa-map-marker-alt" aria-hidden="true"></i><h4>Select a Facility</h4><p>Click any point on the map to view detailed quality scores</p></div></div></aside>
        <div class="footer-bar" aria-label="Legal"><a href="/about">About</a><a href="/methodology">Methodology</a><a href="/medical-disclaimer">Disclaimer</a><a href="/dispute-process">Dispute</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
    </main>

    <!--
      MOBILE-CLEAN-1 (v5.6): the mobile surface is now a STATIC bottom control bar,
      not a draggable peek/half/full sheet. In MAP view it is a fixed bar (the
      List/Map toggle + the facility-type chips) and nothing else — no search, no
      Near-me, no enforcement toggle, no capabilities, no list — leaving the map
      fully visible and uncluttered. Tapping LIST expands the sheet to cover the
      map and show the scrollable nearby list under the same static bar. DETAIL is
      a full overlay with an always-present, prominent Close button.
    -->
    <div class="bottom-sheet" id="detail-sheet" aria-label="Facilities" role="region" aria-hidden="false">
        <!-- HOME mode: static control bar (Map view) / expands to cover map (List view) -->
        <div class="sheet-home" id="sheet-home">
            <div class="sheet-bar" id="sheet-bar">
                <div class="view-toggle" id="view-toggle" role="group" aria-label="List or map view">
                    <button type="button" data-view="map" class="on" aria-pressed="true"><i class="fas fa-map" aria-hidden="true"></i> Map</button>
                    <button type="button" data-view="list" aria-pressed="false"><i class="fas fa-list-ul" aria-hidden="true"></i> List</button>
                </div>
                <div class="sheet-chips" id="sheet-chips" role="group" aria-label="Facility types"></div>
            </div>
            <div class="sheet-scroll" id="sheet-scroll">
                <div class="sheet-statsrow">
                    <span class="sheet-stats" id="sheet-stats" aria-live="polite"></span>
                    <button class="sheet-state-pill" id="sheet-state-pill" type="button" aria-label="Clear state filter"><span id="sheet-state-name"></span><i class="fas fa-times x" aria-hidden="true"></i></button>
                </div>
                <div class="sheet-list" id="sheet-list"></div>
            </div>
        </div>
        <!-- DETAIL mode: facility detail (shared renderer) with sticky close header -->
        <div class="sheet-detail" id="sheet-detail" hidden>
            <div class="sheet-detail-bar">
                <button class="sheet-back-btn" id="sheet-back-btn" type="button" aria-label="Back to results"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</button>
                <button class="sheet-close-btn" id="sheet-close-btn" type="button" aria-label="Close facility details"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <div class="sheet-body" id="detail-sheet-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
